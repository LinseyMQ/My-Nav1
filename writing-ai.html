<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>墨语 · 小说创作工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        :root {
            --bg-main: #fef9ef;
            --bg-sidebar: #f5efe7;
            --bg-editor: #ffffff;
            --text-primary: #2c3e2f;
            --text-secondary: #5b6e5c;
            --border: #e2dcd2;
            --accent: #b87c4f;
            --accent-hover: #9e623b;
            --card-bg: #ffffffcc;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body.dark {
            --bg-main: #1a1e24;
            --bg-sidebar: #232830;
            --bg-editor: #2c313a;
            --text-primary: #eceff4;
            --text-secondary: #b9bfc9;
            --border: #3a3f48;
            --accent: #d99e6e;
            --accent-hover: #e6b186;
            --card-bg: #2c313acc;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .logo {
            font-weight: bold;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo i {
            color: var(--accent);
        }
        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        button, .select-proj {
            background: var(--bg-editor);
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
        }
        button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .project-selector {
            background: var(--bg-editor);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.2rem 0.6rem;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 500;
            outline: none;
        }
        .project-actions {
            display: inline-flex;
            gap: 0.3rem;
        }
        .project-actions button {
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1rem 0.8rem;
            gap: 1.5rem;
        }
        .section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        .section-title {
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .section-title span i {
            margin-right: 6px;
        }
        .section-title:hover {
            color: var(--accent);
        }
        .chapter-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }
        .chapter-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.2rem;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .chapter-item.active {
            background: var(--accent);
            color: white;
        }
        .chapter-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .chapter-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }
        .chapter-actions i {
            margin-left: 6px;
            opacity: 0.6;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .chapter-actions i:hover {
            opacity: 1;
        }
        .add-btn {
            background: none;
            border: 1px dashed var(--border);
            width: 100%;
            margin-top: 8px;
            padding: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 20px;
        }
        .entity-count {
            font-size: 0.7rem;
            background: var(--accent);
            color: white;
            border-radius: 30px;
            padding: 0 6px;
            margin-left: 6px;
        }
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            overflow-y: auto;
            padding: 1.5rem;
        }
        .entity-manager {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }
        .search-bar input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-editor);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }
        .entity-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .entity-card {
            background: var(--bg-sidebar);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: 0.1s;
        }
        .entity-header {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            gap: 0.8rem;
            cursor: pointer;
            background: var(--card-bg);
        }
        .entity-header:hover {
            background: var(--border);
        }
        .pin-icon {
            cursor: pointer;
            color: var(--accent);
            font-size: 1rem;
            width: 24px;
            text-align: center;
        }
        .pin-icon.pinned {
            color: #e6b422;
        }
        .entity-name {
            flex: 1;
            font-weight: 600;
            font-size: 1rem;
        }
        .entity-desc-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .entity-actions {
            display: flex;
            gap: 0.5rem;
        }
        .entity-detail {
            padding: 1rem;
            border-top: 1px solid var(--border);
            background: var(--bg-editor);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .entity-detail input, .entity-detail textarea {
            width: 100%;
            padding: 0.6rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg-sidebar);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .entity-detail textarea {
            min-height: 80px;
            resize: vertical;
        }
        .detail-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
        }
        .btn-save, .btn-delete {
            padding: 0.4rem 1rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-save {
            background: var(--accent);
            color: white;
        }
        .btn-delete {
            background: #c44;
            color: white;
        }
        .empty-tip {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        .editor-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chapter-header {
            padding: 0 0 1rem 0;
            display: flex;
            gap: 1rem;
            align-items: baseline;
        }
        .chapter-name-input {
            font-size: 1.6rem;
            font-weight: bold;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            color: var(--text-primary);
            width: 60%;
            outline: none;
            font-family: inherit;
        }
        .word-stats {
            font-size: 0.8rem;
            background: var(--bg-sidebar);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }
        .editor-toolbar {
            padding: 0.5rem 0;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .tool-btn {
            background: var(--bg-sidebar);
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .markdown-input {
            flex: 1;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            background: var(--bg-editor);
            color: var(--text-primary);
            border: none;
            resize: none;
            outline: none;
            width: 100%;
        }
        .status-bar {
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }
        @media (max-width: 800px) {
            .sidebar {
                width: 240px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-feather-alt"></i> 墨语 · 小说工坊
        </div>
        <div class="actions">
            <div class="project-selector">
                <i class="fas fa-book-open"></i>
                <select id="projectSelect"></select>
                <div class="project-actions">
                    <button id="editProjectBtn" title="编辑项目名称"><i class="fas fa-edit"></i></button>
                    <button id="deleteProjectBtn" title="删除项目"><i class="fas fa-trash-alt"></i></button>
                    <button id="newProjectBtn" title="新建项目"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <button id="themeToggleBtn"><i class="fas fa-moon"></i> 日夜模式</button>
            <button id="exportFullProjectBtn"><i class="fas fa-archive"></i> 导出项目(JSON)</button>
            <button id="importFullProjectBtn"><i class="fas fa-file-import"></i> 导入项目</button>
            <button id="exportProjectAsTxtBtn"><i class="fas fa-file-alt"></i> 导出为TXT</button>
            <button id="exportSelectedChaptersBtn"><i class="fas fa-download"></i> 批量导出章节</button>
            <button id="mergeChaptersBtn"><i class="fas fa-merge"></i> 合并章节(JSON)</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="section">
                <div class="section-title" id="goToEditorBtn">
                    <span><i class="fas fa-pen-fancy"></i> 章节创作</span>
                </div>
                <ul id="chapterListContainer" class="chapter-list"></ul>
                <button id="addChapterBtn" class="add-btn"><i class="fas fa-plus"></i> 新章节</button>
                <div style="font-size:12px; margin-top:6px; color:var(--text-secondary);"><i class="fas fa-check-square"></i> 勾选章节后点击「批量导出」</div>
            </div>
            <div class="section">
                <div class="section-title" id="goToCharactersBtn">
                    <span><i class="fas fa-users"></i> 角色百科</span>
                    <span id="charCountBadge" class="entity-count">0</span>
                </div>
            </div>
            <div class="section">
                <div class="section-title" id="goToPlacesBtn">
                    <span><i class="fas fa-map-marker-alt"></i> 地点/设定</span>
                    <span id="placeCountBadge" class="entity-count">0</span>
                </div>
            </div>
        </div>

        <div id="viewContainer" class="view-container"></div>
    </div>
</div>

<script>
    let projects = [];
    let currentProjectId = null;
    let currentChapterId = null;
    let autoSaveTimer = null;
    let contentChanged = false;
    let currentView = 'editor'; // 'editor', 'characters', 'places'

    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 6); }

    function initDefaultData() {
        const defaultProject = {
            id: generateId(),
            name: "星尘幻想",
            chapters: [
                { id: generateId(), title: "楔子 · 风起", content: "# 序章\n\n夜幕低垂，星辰如尘。", order: 1 },
                { id: generateId(), title: "第一章 学徒", content: "少年擦拭着铜炉，火光映照在脸上。", order: 2 }
            ],
            characters: [
                { id: generateId(), name: "艾琳", desc: "坚韧的女剑士", pinned: false },
                { id: generateId(), name: "老法师梅林", desc: "智慧神秘", pinned: true }
            ],
            places: [
                { id: generateId(), name: "暮光城", desc: "边境商贸城市", pinned: false },
                { id: generateId(), name: "叹息森林", desc: "远古遗迹", pinned: true }
            ]
        };
        const secondProject = {
            id: generateId(),
            name: "新大陆日志",
            chapters: [{ id: generateId(), title: "启程", content: "船帆扬起，海风咸涩。", order: 1 }],
            characters: [],
            places: []
        };
        projects.push(defaultProject, secondProject);
        saveProjectsToLocal();
    }

    function saveProjectsToLocal() {
        localStorage.setItem("novel_writer_projects", JSON.stringify(projects));
    }

    function loadProjectsFromLocal() {
        const raw = localStorage.getItem("novel_writer_projects");
        if (raw) {
            projects = JSON.parse(raw);
            if (projects.length === 0) initDefaultData();
            projects.forEach(proj => {
                proj.characters.forEach(c => { if(c.pinned === undefined) c.pinned = false; });
                proj.places.forEach(p => { if(p.pinned === undefined) p.pinned = false; });
            });
        } else {
            initDefaultData();
        }
        if (!currentProjectId || !projects.find(p => p.id === currentProjectId)) {
            currentProjectId = projects[0]?.id || null;
        }
    }

    function getCurrentProject() {
        return projects.find(p => p.id === currentProjectId);
    }

    function updateSidebarCounts() {
        const proj = getCurrentProject();
        if(proj) {
            document.getElementById('charCountBadge').innerText = proj.characters.length;
            document.getElementById('placeCountBadge').innerText = proj.places.length;
        }
    }

    // 渲染章节列表（侧边栏）
    function renderChapterSidebar() {
        const proj = getCurrentProject();
        if (!proj) return;
        const container = document.getElementById('chapterListContainer');
        container.innerHTML = '';
        const sorted = [...proj.chapters].sort((a,b) => (a.order||0) - (b.order||0));
        sorted.forEach(ch => {
            const li = document.createElement('li');
            li.className = 'chapter-item';
            if (currentChapterId === ch.id) li.classList.add('active');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.classList.add('chapter-checkbox');
            cb.value = ch.id;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'chapter-title';
            titleSpan.innerText = ch.title || '无标题';
            const actionDiv = document.createElement('div');
            actionDiv.className = 'chapter-actions';
            const editIcon = document.createElement('i');
            editIcon.className = 'fas fa-edit';
            editIcon.onclick = (e) => { e.stopPropagation(); renameChapter(ch.id); };
            const delIcon = document.createElement('i');
            delIcon.className = 'fas fa-trash-alt';
            delIcon.onclick = (e) => { e.stopPropagation(); deleteChapter(ch.id); };
            actionDiv.appendChild(editIcon);
            actionDiv.appendChild(delIcon);
            li.appendChild(cb);
            li.appendChild(titleSpan);
            li.appendChild(actionDiv);
            li.onclick = (e) => {
                if(e.target.type !== 'checkbox' && e.target.tagName !== 'I') {
                    switchToEditorAndChapter(ch.id);
                }
            };
            container.appendChild(li);
        });
    }

    function renameChapter(chId) {
        const proj = getCurrentProject();
        const ch = proj.chapters.find(c => c.id === chId);
        if (!ch) return;
        let newTitle = prompt("输入新章节标题:", ch.title);
        if(newTitle) { ch.title = newTitle; saveProjectsToLocal(); renderChapterSidebar(); if(currentChapterId===chId && currentView==='editor') document.getElementById('chapterTitleInput') && (document.getElementById('chapterTitleInput').value = newTitle); }
    }
    function deleteChapter(chId) {
        if(confirm("删除章节不可撤销，确定？")) {
            const proj = getCurrentProject();
            proj.chapters = proj.chapters.filter(c => c.id !== chId);
            if(currentChapterId === chId) {
                if(proj.chapters.length>0) switchToEditorAndChapter(proj.chapters[0].id);
                else { currentChapterId = null; if(currentView==='editor') renderEditorView(); }
            }
            saveProjectsToLocal();
            renderChapterSidebar();
            if(currentView==='editor' && currentChapterId) loadChapterToEditor(currentChapterId);
            else if(currentView==='editor') renderEditorView();
        }
    }

    function switchToEditorAndChapter(chId) {
        if(contentChanged && currentView==='editor') saveCurrentChapterContent();
        currentView = 'editor';
        currentChapterId = chId;
        renderEditorView();
        renderChapterSidebar();
    }

    // ========== 编辑器视图 ==========
    function renderEditorView() {
        const container = document.getElementById('viewContainer');
        container.innerHTML = `
            <div class="editor-view">
                <div class="chapter-header">
                    <input type="text" id="chapterTitleInput" class="chapter-name-input" placeholder="章节标题">
                    <span class="word-stats" id="wordCountDisplay">0 字</span>
                </div>
                <div class="editor-toolbar">
                    <button class="tool-btn" data-action="bold"><i class="fas fa-bold"></i> 加粗</button>
                    <button class="tool-btn" data-action="italic"><i class="fas fa-italic"></i> 斜体</button>
                    <button class="tool-btn" data-action="h1"><i class="fas fa-heading"></i> H1</button>
                    <button class="tool-btn" data-action="h2"><i class="fas fa-heading"></i> H2</button>
                    <button class="tool-btn" data-action="link"><i class="fas fa-link"></i> 链接</button>
                    <button class="tool-btn" data-action="ul"><i class="fas fa-list-ul"></i> 列表</button>
                </div>
                <textarea id="markdownEditor" class="markdown-input" placeholder="在这里书写你的故事... 支持Markdown语法"></textarea>
                <div class="status-bar">
                    <span><i class="far fa-save"></i> <span id="saveStatus">已保存</span></span>
                    <span><i class="far fa-clock"></i> 自动保存中</span>
                </div>
            </div>
        `;
        const titleInput = document.getElementById('chapterTitleInput');
        const editorArea = document.getElementById('markdownEditor');
        if(titleInput) titleInput.addEventListener('input', () => { contentChanged = true; saveCurrentChapterContent(); renderChapterSidebar(); });
        if(editorArea) editorArea.addEventListener('input', onEditorContentChange);
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const action = btn.getAttribute('data-action');
                if(action === 'bold') insertMarkdown('**', '**');
                else if(action === 'italic') insertMarkdown('*', '*');
                else if(action === 'h1') insertMarkdown('# ', '');
                else if(action === 'h2') insertMarkdown('## ', '');
                else if(action === 'link') insertMarkdown('[', '](url)');
                else if(action === 'ul') insertMarkdown('- ', '');
            });
        });
        if(currentChapterId) loadChapterToEditor(currentChapterId);
        else clearEditorUI();
    }

    function loadChapterToEditor(chId) {
        const ch = getCurrentProject()?.chapters.find(c => c.id === chId);
        if(ch) {
            const titleInput = document.getElementById('chapterTitleInput');
            const editorArea = document.getElementById('markdownEditor');
            if(titleInput) titleInput.value = ch.title;
            if(editorArea) editorArea.value = ch.content || '';
            updateWordCountDisplay();
            contentChanged = false;
            const statusSpan = document.getElementById('saveStatus');
            if(statusSpan) statusSpan.innerText = '已加载';
        }
    }
    function clearEditorUI() {
        const titleInput = document.getElementById('chapterTitleInput');
        const editorArea = document.getElementById('markdownEditor');
        if(titleInput) titleInput.value = '';
        if(editorArea) editorArea.value = '';
        updateWordCountDisplay();
    }
    function updateWordCountDisplay() {
        const editorArea = document.getElementById('markdownEditor');
        const wordSpan = document.getElementById('wordCountDisplay');
        if(editorArea && wordSpan) wordSpan.innerText = editorArea.value.length + ' 字';
    }
    function saveCurrentChapterContent() {
        if(!currentChapterId || currentView !== 'editor') return;
        const proj = getCurrentProject();
        const ch = proj.chapters.find(c => c.id === currentChapterId);
        if(ch) {
            const newTitle = document.getElementById('chapterTitleInput')?.value || '';
            const newContent = document.getElementById('markdownEditor')?.value || '';
            if(newTitle.trim()) ch.title = newTitle;
            ch.content = newContent;
            saveProjectsToLocal();
            contentChanged = false;
            const statusSpan = document.getElementById('saveStatus');
            if(statusSpan) statusSpan.innerText = '已保存';
            setTimeout(()=>{ if(statusSpan && statusSpan.innerText === '已保存') statusSpan.innerText = '已同步'; }, 1500);
            renderChapterSidebar();
        }
    }
    function onEditorContentChange() {
        contentChanged = true;
        updateWordCountDisplay();
        if(autoSaveTimer) clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
            saveCurrentChapterContent();
            const statusSpan = document.getElementById('saveStatus');
            if(statusSpan) statusSpan.innerText = '自动保存';
            setTimeout(()=>{ if(!contentChanged && statusSpan) statusSpan.innerText = '已保存'; }, 1000);
        }, 800);
    }
    function insertMarkdown(syntaxBefore, syntaxAfter = '') {
        const textarea = document.getElementById('markdownEditor');
        if(!textarea) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.substring(start, end);
        const newText = textarea.value.substring(0, start) + syntaxBefore + selected + syntaxAfter + textarea.value.substring(end);
        textarea.value = newText;
        textarea.focus();
        textarea.selectionStart = start + syntaxBefore.length;
        textarea.selectionEnd = end + syntaxBefore.length;
        onEditorContentChange();
    }

    // ========== 实体管理渲染 ==========
    function renderCharactersView() { renderEntityManager('characters', '角色百科', 'character'); }
    function renderPlacesView() { renderEntityManager('places', '地点/设定', 'place'); }

    function renderEntityManager(type, title, entityType) {
        const proj = getCurrentProject();
        if(!proj) return;
        const items = type === 'characters' ? proj.characters : proj.places;
        const container = document.getElementById('viewContainer');
        container.innerHTML = `
            <div class="entity-manager">
                <h2 style="margin-bottom: 1rem;"><i class="fas ${type==='characters'?'fa-users':'fa-map-marker-alt'}"></i> ${title}</h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索名称或描述...">
                    <button id="addEntityBtn" class="add-btn" style="width: auto;"><i class="fas fa-plus"></i> 新增</button>
                </div>
                <div id="entityListContainer" class="entity-list"></div>
            </div>
        `;
        const searchInput = document.getElementById('searchInput');
        const addBtn = document.getElementById('addEntityBtn');
        const renderList = () => {
            const searchTerm = searchInput.value.toLowerCase();
            let filtered = items.filter(item => item.name.toLowerCase().includes(searchTerm) || (item.desc && item.desc.toLowerCase().includes(searchTerm)));
            filtered.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || a.name.localeCompare(b.name));
            const listContainer = document.getElementById('entityListContainer');
            listContainer.innerHTML = '';
            if(filtered.length === 0) {
                listContainer.innerHTML = '<div class="empty-tip">暂无数据，点击「新增」添加</div>';
                return;
            }
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'entity-card';
                let expanded = false;
                const header = document.createElement('div');
                header.className = 'entity-header';
                const pinIcon = document.createElement('i');
                pinIcon.className = `fas fa-thumbtack pin-icon ${item.pinned ? 'pinned' : ''}`;
                pinIcon.onclick = (e) => { e.stopPropagation(); togglePin(type, item.id); renderList(); };
                const nameSpan = document.createElement('div');
                nameSpan.className = 'entity-name';
                nameSpan.innerText = item.name;
                const previewSpan = document.createElement('div');
                previewSpan.className = 'entity-desc-preview';
                previewSpan.innerText = item.desc || '无描述';
                const actionDiv = document.createElement('div');
                actionDiv.className = 'entity-actions';
                const deleteIcon = document.createElement('i');
                deleteIcon.className = 'fas fa-trash-alt';
                deleteIcon.style.cursor = 'pointer';
                deleteIcon.onclick = (e) => { e.stopPropagation(); if(confirm('删除不可恢复')) { deleteEntity(type, item.id); renderList(); updateSidebarCounts(); } };
                actionDiv.appendChild(deleteIcon);
                header.appendChild(pinIcon);
                header.appendChild(nameSpan);
                header.appendChild(previewSpan);
                header.appendChild(actionDiv);
                header.onclick = () => {
                    if(expanded) {
                        card.removeChild(card.lastChild);
                        expanded = false;
                    } else {
                        const detailDiv = document.createElement('div');
                        detailDiv.className = 'entity-detail';
                        detailDiv.innerHTML = `
                            <input id="editName_${item.id}" value="${escapeHtml(item.name)}" placeholder="名称">
                            <textarea id="editDesc_${item.id}" placeholder="描述">${escapeHtml(item.desc || '')}</textarea>
                            <div class="detail-buttons">
                                <button class="btn-save">保存</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        `;
                        const saveBtn = detailDiv.querySelector('.btn-save');
                        const delBtn = detailDiv.querySelector('.btn-delete');
                        saveBtn.onclick = () => {
                            const newName = detailDiv.querySelector(`#editName_${item.id}`).value.trim();
                            const newDesc = detailDiv.querySelector(`#editDesc_${item.id}`).value;
                            if(newName) item.name = newName;
                            item.desc = newDesc;
                            saveProjectsToLocal();
                            renderList();
                            updateSidebarCounts();
                        };
                        delBtn.onclick = () => {
                            if(confirm('删除不可恢复')) {
                                deleteEntity(type, item.id);
                                renderList();
                                updateSidebarCounts();
                            }
                        };
                        card.appendChild(detailDiv);
                        expanded = true;
                    }
                };
                card.appendChild(header);
                listContainer.appendChild(card);
            });
        };
        searchInput.addEventListener('input', renderList);
        addBtn.onclick = () => {
            let newName = prompt('请输入名称');
            if(newName && newName.trim()) {
                const newItem = { id: generateId(), name: newName.trim(), desc: '', pinned: false };
                if(type === 'characters') proj.characters.push(newItem);
                else proj.places.push(newItem);
                saveProjectsToLocal();
                renderList();
                updateSidebarCounts();
            }
        };
        renderList();
    }

    function togglePin(type, id) {
        const proj = getCurrentProject();
        const arr = type === 'characters' ? proj.characters : proj.places;
        const item = arr.find(i => i.id === id);
        if(item) item.pinned = !item.pinned;
        saveProjectsToLocal();
    }
    function deleteEntity(type, id) {
        const proj = getCurrentProject();
        if(type === 'characters') proj.characters = proj.characters.filter(c => c.id !== id);
        else proj.places = proj.places.filter(p => p.id !== id);
        saveProjectsToLocal();
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function setView(view) {
        if(contentChanged && currentView === 'editor') saveCurrentChapterContent();
        currentView = view;
        if(view === 'editor') {
            if(!currentChapterId && getCurrentProject()?.chapters.length) currentChapterId = getCurrentProject().chapters[0].id;
            renderEditorView();
        } else if(view === 'characters') renderCharactersView();
        else if(view === 'places') renderPlacesView();
        renderChapterSidebar();
        updateSidebarCounts();
    }

    // ========== 项目操作：编辑、删除 ==========
    function editProject() {
        const proj = getCurrentProject();
        if(!proj) return;
        let newName = prompt("输入新的项目名称:", proj.name);
        if(newName && newName.trim()) {
            newName = newName.trim();
            // 检查重名（排除自身）
            if(projects.some(p => p.id !== proj.id && p.name === newName)) {
                alert("项目名称已存在，请使用其他名称。");
                return;
            }
            proj.name = newName;
            saveProjectsToLocal();
            populateProjectSelect();
            // 刷新当前视图标题栏（如果是编辑器视图无影响，但确保侧边栏显示正确）
            renderChapterSidebar();
            updateSidebarCounts();
            alert("项目名称已更新");
        }
    }

    function deleteProject() {
        if(projects.length <= 1) {
            alert("至少保留一个项目，无法删除最后一个项目。");
            return;
        }
        const proj = getCurrentProject();
        if(!proj) return;
        if(confirm(`确定要永久删除项目「${proj.name}」及其所有章节、角色、地点吗？此操作不可恢复！`)) {
            const index = projects.findIndex(p => p.id === currentProjectId);
            projects.splice(index, 1);
            // 切换到剩余的第一个项目
            const newCurrent = projects[0];
            currentProjectId = newCurrent.id;
            currentChapterId = newCurrent.chapters.length ? newCurrent.chapters[0].id : null;
            saveProjectsToLocal();
            populateProjectSelect();
            // 重置视图
            if(contentChanged) contentChanged = false;
            setView('editor');
            alert(`项目「${proj.name}」已删除。`);
        }
    }

    // 其他全局功能
    function exportFullProject() {
        const proj = getCurrentProject(); if(!proj) return;
        const exportData = { version:"1.0", exportType:"full_project", project:JSON.parse(JSON.stringify(proj)) };
        const blob = new Blob([JSON.stringify(exportData,null,2)], {type:'application/json'});
        const url=URL.createObjectURL(blob); const a=document.createElement('a');
        a.href=url; a.download=`${proj.name}_完整项目.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        alert(`项目「${proj.name}」已完整导出。`);
    }
    function importFullProject() {
        const input = document.createElement('input'); input.type='file'; input.accept='application/json';
        input.onchange=e=>{ const file=e.target.files[0]; if(!file)return; const reader=new FileReader();
        reader.onload=ev=>{ try{ const raw=JSON.parse(ev.target.result); let imported=raw.project||raw;
        if(!imported.chapters) throw new Error(); const newId=generateId(); let newName=imported.name; let suffix=1;
        while(projects.some(p=>p.name===newName)){ newName=`${imported.name} (${suffix})`; suffix++; }
        const newProject={...imported, id:newId, name:newName, chapters:imported.chapters.map(ch=>({...ch, id:generateId()})),
            characters:(imported.characters||[]).map(c=>({...c, id:generateId(), pinned:false})),
            places:(imported.places||[]).map(p=>({...p, id:generateId(), pinned:false})) };
        projects.push(newProject); saveProjectsToLocal(); populateProjectSelect();
        if(confirm(`导入项目「${newName}」，立即切换？`)) switchProject(newProject.id); else setView(currentView);
        alert('导入成功'); }catch(e){ alert('无效文件'); } }; reader.readAsText(file); }; input.click();
    }
    function exportProjectAsTxt() {
        const proj=getCurrentProject(); if(!proj)return;
        const sorted=[...proj.chapters].sort((a,b)=>(a.order||0)-(b.order||0));
        let txt=`《${proj.name}》\n导出时间：${new Date().toLocaleString()}\n================================\n\n`;
        sorted.forEach((ch,i)=>{ txt+=`第 ${i+1} 章 ${ch.title||'无标题'}\n-----------------------------------\n${ch.content||''}\n\n`; });
        txt+=`总计 ${sorted.length} 章 | 总字数：${sorted.reduce((s,c)=>s+(c.content?.length||0),0)} 字`;
        const blob=new Blob([txt],{type:'text/plain'}); const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=`${proj.name}_完整小说.txt`; a.click(); URL.revokeObjectURL(url);
        alert('已导出TXT');
    }
    function exportSelectedChapters() {
        const proj=getCurrentProject(); if(!proj)return;
        const checks=document.querySelectorAll('#chapterListContainer .chapter-checkbox:checked');
        if(checks.length===0){alert('请勾选章节');return;}
        const selected=Array.from(checks).map(cb=>cb.value);
        const chapters=proj.chapters.filter(c=>selected.includes(c.id));
        const data={projectName:proj.name, chapters:chapters.map(ch=>({title:ch.title,content:ch.content,order:ch.order}))};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob); const a=document.createElement('a');
        a.href=url; a.download=`chapters_${proj.name}.json`; a.click(); URL.revokeObjectURL(url);
        alert(`导出${chapters.length}个章节`);
    }
    function mergeChaptersToCurrent() {
        const input=document.createElement('input'); input.type='file'; input.accept='application/json';
        input.onchange=e=>{ const file=e.target.files[0]; if(!file)return; const reader=new FileReader();
        reader.onload=ev=>{ try{ const data=JSON.parse(ev.target.result); let chapters=data.chapters;
        if(!chapters)throw new Error(); const proj=getCurrentProject();
        const maxOrder=proj.chapters.reduce((m,c)=>Math.max(m,c.order||0),0);
        const newChapters=chapters.map((chap,i)=>({id:generateId(), title:chap.title||'导入章节', content:chap.content||'', order:maxOrder+i+1}));
        proj.chapters.push(...newChapters); saveProjectsToLocal(); renderChapterSidebar();
        if(currentView==='editor' && newChapters.length) switchToEditorAndChapter(newChapters[0].id);
        else setView(currentView); alert(`合并${newChapters.length}章节`); }catch(e){ alert('文件格式错误'); } }; reader.readAsText(file); }; input.click();
    }
    function populateProjectSelect() {
        const select=document.getElementById('projectSelect'); select.innerHTML='';
        projects.forEach(proj=>{ const opt=document.createElement('option'); opt.value=proj.id; opt.textContent=proj.name; if(proj.id===currentProjectId) opt.selected=true; select.appendChild(opt); });
    }
    function switchProject(projectId) {
        if(contentChanged && currentView==='editor') saveCurrentChapterContent();
        currentProjectId=projectId; const proj=getCurrentProject();
        if(proj && proj.chapters.length) currentChapterId=proj.chapters[0].id; else currentChapterId=null;
        setView(currentView); populateProjectSelect(); saveProjectsToLocal();
    }
    function newProject() {
        let name=prompt("新项目名称:"); if(name){ name=name.trim();
        let suffix=1; let baseName=name; while(projects.some(p=>p.name===name)){ name=`${baseName} (${suffix})`; suffix++; }
        const newProj={ id:generateId(), name:name, chapters:[{id:generateId(), title:"开篇", content:"# 第一章\n\n故事从这里开始...", order:1}], characters:[], places:[] };
        projects.push(newProj); saveProjectsToLocal(); switchProject(newProj.id);
    } }
    function addChapter() {
        const proj=getCurrentProject(); const newId=generateId();
        proj.chapters.push({id:newId, title:"新章节", content:"## 新章节\n\n在这里书写...", order:proj.chapters.length+1});
        saveProjectsToLocal(); renderChapterSidebar(); if(currentView==='editor') switchToEditorAndChapter(newId); else setView(currentView);
    }
    function toggleTheme() { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light'); }
    function loadTheme() { if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark'); }

    function bindGlobalEvents() {
        document.getElementById('goToEditorBtn')?.addEventListener('click', () => setView('editor'));
        document.getElementById('goToCharactersBtn')?.addEventListener('click', () => setView('characters'));
        document.getElementById('goToPlacesBtn')?.addEventListener('click', () => setView('places'));
        document.getElementById('addChapterBtn')?.addEventListener('click', addChapter);
        document.getElementById('newProjectBtn')?.addEventListener('click', newProject);
        document.getElementById('editProjectBtn')?.addEventListener('click', editProject);
        document.getElementById('deleteProjectBtn')?.addEventListener('click', deleteProject);
        document.getElementById('projectSelect')?.addEventListener('change', (e) => switchProject(e.target.value));
        document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
        document.getElementById('exportFullProjectBtn')?.addEventListener('click', exportFullProject);
        document.getElementById('importFullProjectBtn')?.addEventListener('click', importFullProject);
        document.getElementById('exportProjectAsTxtBtn')?.addEventListener('click', exportProjectAsTxt);
        document.getElementById('exportSelectedChaptersBtn')?.addEventListener('click', exportSelectedChapters);
        document.getElementById('mergeChaptersBtn')?.addEventListener('click', mergeChaptersToCurrent);
    }

    function init() {
        loadProjectsFromLocal();
        populateProjectSelect();
        if(projects.length && !currentProjectId) currentProjectId = projects[0].id;
        const proj=getCurrentProject();
        if(proj && proj.chapters.length) currentChapterId = proj.chapters[0].id;
        bindGlobalEvents();
        setView('editor');
        loadTheme();
        setInterval(() => { if(contentChanged && currentView==='editor') saveCurrentChapterContent(); }, 30000);
    }
    init();
</script>
</body>
