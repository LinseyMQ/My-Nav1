<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

<div class="container mx-auto px-4 py-8 max-w-7xl">

            </div>
            <div>

    <!-- 主体：两栏布局 -->

        <!-- 左栏：控制配置面板 -->

 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

<!-- ======================= JavaScript 逻辑核心 ======================= -->
<script>
   // --- 1. 全局配置与存储 ---
    const STORAGE = {
        API_KEY: 'gemini_key_v3', // 使用新 Key 防止缓存冲突
        MODEL: 'gemini_aid_model_v2',
        REF_HISTORY: 'gemini_aid_ref_history_v2',
        CHANNELS: 'gemini_aid_channels_v2',
        DARK_MODE: 'gemini_aid_dark_mode_v2'
    };

    // 预设默认体验数据 (爆款微短剧风格样本)
    const defaultSampleCopywriting = `[Flash Marriage]💍 Married The Mafioso I Saved 🔥 I Married a Stranger… Then Found Out He's Dangerous

🎬 Head to ReelShort site for more HD EPs👉:
https://www.reelshort.com/movie/married-the-mafioso-i-saved-69c0a298c87f09a7e10d8ffe

💟 Full Playlist-HD:
https://www.dailymotion.com/reel-romance-swipe

🍁Notice: Reel Romance Swipe is an officially authorized publisher of ReelShort content.

✍Synopsis: 🔍
After being betrayed, Hannah marries a stranger to stay in the country.

But the man she saved with a kiss is hiding a dangerous identity.

As their bond grows, secrets begin to surface.


🧑Lead Actor: Noah Fearnley/Savannah Coffee
👩Lead Actress: Jacqueline Brooks/Joe Solana Simon/Jon Rust

💔GENRE: Flash Marriage, Hidden Identity, Mafia Romance,
Sweet Romance

#reelshort #romance #FlashMarriage #Mafia #HiddenIdentity #shortdrama #FYP #2026`;

    const defaultChannels = [
        "https://www.dailymotion.com/reel-raw-vibe",
        "https://www.dailymotion.com/reel-romance-swipe",

    ];

   // --- 2. API Key 处理逻辑 (核心优化点) ---
    // 使用 Base64 简单混淆存储，防止明文泄露
    function getApiKey() {
        const encoded = localStorage.getItem(STORAGE.API_KEY);
        if (!encoded) return '';
        try { return atob(encoded); } catch (e) { return localStorage.getItem(STORAGE.API_KEY) || ''; }
    }

    function saveApiKey(key) {
        if (key && key.trim()) {
            localStorage.setItem(STORAGE.API_KEY, btoa(key.trim()));
        }
    }

    // --- 3. 初始化与事件绑定 ---
    document.addEventListener("DOMContentLoaded", function() {
        initTheme();
        
        // 初始化 API Key 输入框
        const keyInput = document.getElementById('apiKey');
        keyInput.value = getApiKey();
        
        // 失去焦点时自动加密保存
        keyInput.addEventListener('blur', (e) => saveApiKey(e.target.value));

        // ... 触发您原有的其他初始化函数 ...
        renderRefHistoryDropdown();
        renderChannelsChecklist();
        lucide.createIcons();
    });

    // --- 4. 核心生成逻辑 (修复了原代码中的重复定义问题) ---
    async function generateCopywriting() {
        const apiKey = getApiKey();
        const model = document.getElementById('modelSelect').value;
        
        if (!apiKey) {
            showErrorModal("缺少 API 密钥", "请先在上方配置栏粘贴您的 API 密钥。");
            return;
        }

        // 基础验证与数据获取
        // ... (此处保留您原有的表单获取逻辑，如 dramaInfo, refCopy 等) ...
        
        setLoadingState(true);

        try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
            
            // 使用封装好的重试机制请求
            const resData = await fetchWithRetry(endpoint, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-goog-api-key": apiKey // 直接透传完整的 AQ. 开头 Key
                },
                body: JSON.stringify({ /* ... 您的 prompt payload ... */ })
            });

            if (resData.error) throw new Error(resData.error.message);
            
            const rawText = resData.candidates[0].content.parts[0].text;
            renderResponseResults(JSON.parse(rawText.trim()).results);

        } catch (err) {
            showErrorModal("AI 生成阻碍", err.message || "请求失败，请检查网络或 API Key 有效性。");
        } finally {
            setLoadingState(false);
        }
    }

    // --- 5. 工具函数 (Fetch 重试、UI 控制等) ---
    async function fetchWithRetry(url, options, retries = 3) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "请求失败");
        return data;
    }

    // --- 存储层小助手 ---
    function STORAGE_REF_HISTORY_LATEST() { return STORAGE.REF_HISTORY; }
    function getStoredData(key) {
        try {
            const data = localStorage.getItem(key);

    // --- 指数级退避 Fetch 机制 ---
    async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
        try {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) {
                if (data.error) {
                    throw new Error(data.error.message || `HTTP error! Status: ${response.status}`);
                }
                throw new Error(`请求响应非200状态：${response.status}`);
            }
            return data;
        } catch (err) {
            if (retries > 1) {
                // 指数延迟双倍增加
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(url, options, retries - 1, delay * 2);
            } else {
                throw err;
            }
        }
    }

            const combined = group.copies.map((c, i) => `【文案 ${i + 1} - ${c.style_tag}】\n${c.content}`).join('\n\n====================\n\n');

    // 经典兼容型剪切板写入防死锁函数
    function performClipboardCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        // 隐式定位以不破坏页面视口
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
        } catch (e) {
            console.error('浏览器不支持或权限被禁用', e);
        }
        document.body.removeChild(textarea);
    }

        const toast = document.getElementById('toast');
        const textSpan = document.getElementById('toastText');
        const iconDiv = document.getElementById('toast-success-icon');

        textSpan.textContent = message;
        if (isSuccess) {
            iconDiv.classList.remove('hidden');
        } else {
            iconDiv.classList.add('hidden');
        }

        toast.classList.remove('hidden');
        setTimeout(() => {
            toast.classList.remove('translate-y-10', 'opacity-0');
        }, 10);

        setTimeout(() => {
            toast.classList.add('translate-y-10', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 300);
        }, 2200);
    }

    // --- 自定义异常阻断 Modal 控制 (无 alert 代替) ---
    function showErrorModal(title, message) {
        const modal = document.getElementById('errorModal');
        const mContent = document.getElementById('errorModalContent');
        
        document.getElementById('errorTitle').textContent = title;
        document.getElementById('errorMessage').textContent = message;

        modal.classList.remove('hidden');
        setTimeout(() => {
            mContent.classList.remove('scale-95', 'opacity-0');
        }, 10);
    }

    function closeErrorModal() {
        const modal = document.getElementById('errorModal');
        const mContent = document.getElementById('errorModalContent');

        mContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 250);
    }

    // 标签实体防止页面溢出/XSS注入
    function escapeHtml(string) {
        const matchHtmlRegExp = /["'&<>]/;
        const str = '' + string;
        const match = matchHtmlRegExp.exec(str);
        if (!match) return str;
        let escape;
        let html = '';
        let index = 0;
        let lastIndex = 0;
        for (index = match.index; index < str.length; index++) {
            switch (str.charCodeAt(index)) {
                case 34: escape = '&quot;'; break;
                case 38: escape = '&amp;'; break;
                case 39: escape = '&#39;'; break;
                case 60: escape = '&lt;'; break;
                case 62: escape = '&gt;'; break;
                default: continue;
            }
            if (lastIndex !== index) html += str.substring(lastIndex, index);
            lastIndex = index + 1;
            html += escape;
        }
        return lastIndex !== index ? html + str.substring(lastIndex, index) : html;
    }
</script>
