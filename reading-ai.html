<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能精读集成看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 【全页面色彩控制中心】用原生变量彻底替换 Tailwind 的动态编译 */
        :root {
            color-scheme: light !important;
            --bg-global: #f9fafb;      /* 全局大背景：淡灰 */
            --bg-card: #ffffff;        /* 板块卡片背景：纯白 */
            --text-main: #1f2937;      /* 主文字颜色：深灰 */
            --text-muted: #263b66;     /* 次要文字颜色：中灰 */
            --border-color: #e5e7eb;   /* 边框颜色：浅灰 */
            --bg-input: #ffffff;       /* 输入框背景 */
        }
        
        html.dark {
            color-scheme: dark !important;
            --bg-global: #18181b;      /* 全局大背景：暗黑 zinc-900 */
            --bg-card: #27272a;        /* 板块卡片背景：深灰 zinc-800 */
            --text-main: #f4f4f5;      /* 主文字颜色：浅白 zinc-100 */
            --text-muted: #485260;     /* 次要文字颜色：银灰 zinc-400 */
            --border-color: #6b6b9e;   /* 边框颜色：中暗 zinc-700 */
            --bg-input: #18181b;       /* 输入框背景 */
        }

        /* 强制覆盖全页面及所有子板块的背景、文字与边框 */
        body {
            background-color: var(--bg-global) !important;
            color: var(--text-main) !important;
        }
        header, .bg-white, #page-vocabulary, #page-projects, #floatingWidgetExpanded {
            background-color: var(--bg-card) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }
        input, textarea, select {
            background-color: var(--bg-input) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }
        p, .text-gray-600, .text-gray-500, .text-gray-400 {
            color: var(--text-muted) !important;
        }
        .border-gray-200, .border-gray-100, .border-b {
            border-color: var(--border-color) !important;
        }

        /* 红色精读笔记专属 */
        .note-input {
            color: #dc2626 !important;
            background-color: var(--bg-card) !important;
        }
        html.dark .note-input {
            color: #f87171 !important;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        html.dark ::-webkit-scrollbar-thumb { background: #4b5563; }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen flex flex-col relative">

    <header class="border-b px-8 py-4 flex flex-col md:flex-row justify-between items-center sticky top-0 z-40 shadow-xs gap-4">
        <div class="flex flex-wrap items-center space-x-4 lg:space-x-8">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-indigo-600 text-2xl dark:text-indigo-400"></i>
                <span class="text-lg font-bold tracking-wider">SmartReading</span>
            </div>
            <nav class="flex space-x-1">
                <button onclick="switchPage('workbench')" id="nav-workbench" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white hover:bg-blue-600 hover:text-white  transition flex items-center space-x-2">
                    <i class="fa-solid fa-square-poll-horizontal"></i>
                    <span>精读</span>
                </button>
                <button onclick="switchPage('vocabulary')" id="nav-vocabulary" class="px-4 py-2 text-sm font-medium rounded-lg 
                hover:bg-gray-700 hover:text-white dark:hover:bg-zinc-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-spell-check"></i>
                    <span>词汇</span>
                </button>
                <button onclick="switchPage('projects')" id="nav-projects" class="px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-100
         hover:text-white dark:hover:bg-zinc-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-folder-closed"></i>
                    <span>历史</span>
                </button>
            </nav>
        </div>
        
    <div class="flex items-center space-x-3 flex-wrap">
    <div class="flex dark:bg-gray-700 p-1 rounded-lg  text-xs text-white">
        <button onclick="exportAllData()" class="px-3 py-1.5 font-medium rounded-md hover:bg-blue-500 dark:hover:bg-blue-700 text-gray-700 dark:text-white transition flex items-center space-x-1 cursor-pointer">
            <i class="fa-solid fa-download text-blue-500"></i>
            <span>导出</span>
        </button>
        <label class="px-3 py-1.5 font-medium rounded-md hover:bg-gray-700 dark:hover:bg-blue-700 text-gray-700 dark:text-white transition flex items-center space-x-1 cursor-pointer">

            <div id="globalApiBadge" class="text-xs text-white flex items-center space-x-1.5 px-3 py-2 rounded-full dark:bg-gray-600">
                <span class="w-2 h-2 bg-gray-400 rounded-full"></span>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-6">
        
        <div id="page-workbench" class="grid grid-cols-1 xl:grid-cols-3 gap-6">
       
            <div class="rounded-xl border shadow-xs bg-white overflow-hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                    
                    <div class="p-5 flex flex-col justify-between space-y-4 bg-gray-500/50 md:bg-transparent">
                        <div>
                            <h2 class="font-bold text-sm uppercase tracking-wider mb-4 text-indigo-600 flex items-center gap-2">
                                <i class="fa-solid fa-key text-xs text-indigo-500"></i> API 接入配置
                            </h2>
                            <div class="space-y-1.5">

                                <input type="password" id="apiKeyInput" placeholder="请输入有效密钥并保存" class="w-full text-base md:text-sm px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-hidden bg-white">

                    <div class="p-5 md:col-span-2 space-y-4">

                            </button>
                        </div>
                    </div>
            
                </div>
            </div>
            <div class="xl:col-span-2">

                    <div class="flex justify-between items-center border-b pb-4 mb-5">

                        <span class="text-xs">鼠标划词可以自动捕捉单词到右下角浮窗哦</span>
                    </div>
                    <div id="readingFlowContainer" class="space-y-6 overflow-y-auto flex-1 max-h-[70vh] pr-2">
                        <div class="text-center py-24">
                            <i class="fa-solid fa-wand-magic text-4xl mb-4 block"></i>
                            <p>请在左侧贴入长文，体验一键拆分及卡片级多语种翻译精读面板。</p>
                        </div>
                    </div>
                </div>

        <div id="page-vocabulary" class="hidden rounded-xl p-6 border shadow-xs min-h-[75vh]">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-6 gap-4">

                    <h2 class="text-xl font-bold">多语言词汇库</h2>
                    <p class="text-xs mt-1">自动进行全局 A-Z 字典升序重排，数据多端联通</p>
                </div>
                <div class="flex items-center space-x-3 w-full md:w-auto">
                    <input type="text" id="vocabSearchInput" oninput="renderVocabGrid()" placeholder="搜索单词或释义..." class="text-xs px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-hidden w-full md:w-48">
                    <div class="flex bg-gray-100 text-white dark:bg-zinc-600 p-1 rounded-lg shrink-0 ">
                        <button onclick="switchVocabTab('EN')" id="tab-EN" class="px-4 py-1.5 text-xs font-semibold bg-white text-white rounded-md shadow-xs dark:bg-zinc-700 dark:text-white cursor-pointer">英语词汇</button>

                </div>
                <div>

    <div id="floatingVocabContainer" class="fixed bottom-6 right-6 z-50 flex flex-col items-end transition-all duration-300">
        <div id="floatingWidgetExpanded" class="hidden border p-4 rounded-2xl shadow-2xl w-80 space-y-3">
            <div onclick="toggleFloatingWidget(true)" class="flex justify-between items-center border-b pb-2 cursor-pointer group">

            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-semibold text-gray-400 mb-1">归属语种库</label>
                    <select id="floatLang" class="w-full text-xs px-1 py-1.5 border rounded-md">
                        <option value="EN">英语库</option>
             
                        <option value="ZHO">中文库</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-400 mb-1">&nbsp;</label>
                    <button onclick="submitFloatingVocab()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-1.5 rounded-md font-medium transition shadow-xs flex items-center justify-center space-x-1 cursor-pointer">
                        <i class="fa-solid fa-check"></i>

                    </button>
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-gray-400 mb-1">地道释义 / 核心备注</label>
                <textarea id="floatMeaning" rows="2" placeholder="输入单词的意思、音标或例句..." class="w-full text-xs px-2 py-1.5 border rounded-md resize-none"></textarea>
            </div>
        </div>

        <button id="floatingWidgetCollapsed" onclick="toggleFloatingWidget(false)" class="bg-indigo-600 hover:bg-indigo-700 text-white w-12 h-12 rounded-full shadow-xl flex items-center justify-center transition-all duration-300 hover:scale-105 cursor-pointer" title="展开词汇捕捉器">
            <i class="fa-solid fa-feather text-lg"></i>
        </button>
    </div>

    <script>
        let state = {
            apiKey: localStorage.getItem('gemini_api_key_v3') || '',
            projects: JSON.parse(localStorage.getItem('reading_projects_v3')) || [],
            currentProject: null,
            vocabulary: JSON.parse(localStorage.getItem('reading_vocab_v3')) || { EN: [], ZHO: [] },
            currentVocabTab: 'EN',
            currentPage: 'workbench'
        };

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    updateGlobalApiUI();
    renderProjectTable();
    renderVocabGrid();
    
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('saveKeyBtn').addEventListener('click', saveApiKey);
    document.getElementById('splitTextBtn').addEventListener('click', handleSplitText);
    document.addEventListener('mouseup', handleGlobalMouseSelection);

    // ==========================================
    // 【统一的打开/加载项目函数】
    // ==========================================
    window.loadProjectToInput = function(projectName) {
        if (!projectName) return;
        
        // 1. 更新项目名称输入框
        const nameInput = document.getElementById('projectNameInput');
        nameInput.value = projectName;
        localStorage.setItem('cached_project_name', projectName);

        // 2. 尝试读取该项目专属的文本
        const projectTextKey = `project_text_${projectName}`;
        const savedText = localStorage.getItem(projectTextKey) || '';
        
        // 3. 更新文本框并同步工作台所需的当前缓存
        const textInput = document.getElementById('sourceTextInput');
        textInput.value = savedText;
        localStorage.setItem('cached_source_text', savedText);
        
        // 记住最后一次活跃的项目
        localStorage.setItem('last_active_project', projectName);
    };

    // ==========================================
    // 【初始化加载逻辑调整：默认保持空白】
    // ==========================================
    // 💡 移除自动恢复上次项目的逻辑，每次刷新或进入页面，默认都是空白干净的状态
    document.getElementById('projectNameInput').value = '';
    document.getElementById('sourceTextInput').value = '';
    // 同时清理工作台当前的临时残留，防止影响后续的拆分逻辑
    localStorage.removeItem('cached_project_name');
    localStorage.removeItem('cached_source_text');


    // ==========================================
    // 【联动实时保存与联动切换】
    // ==========================================
    document.getElementById('projectNameInput').addEventListener('input', (e) => {
        const name = e.target.value.trim();
        localStorage.setItem('cached_project_name', name);
        
        // 如果用户手动把项目名删空了，文本框也同步清空
        if (!name) {
            document.getElementById('sourceTextInput').value = '';
            localStorage.setItem('cached_source_text', '');
            return;
        }

        // 如果输入了名字，去库里找有没有对应的文本
        const savedText = localStorage.getItem(`project_text_${name}`) || '';
        document.getElementById('sourceTextInput').value = savedText;
        localStorage.setItem('cached_source_text', savedText);
    });

    document.getElementById('sourceTextInput').addEventListener('input', (e) => {
        const text = e.target.value;
        const currentName = document.getElementById('projectNameInput').value.trim();
        
        // 保证当前拆分功能能拿到最新的文本
        localStorage.setItem('cached_source_text', text); 
        
        // 只有在填了项目名的情况下，才同步写入该项目专属的库中
        if (currentName) {
            localStorage.setItem(`project_text_${currentName}`, text);
        }
    });
    // ==========================================

    document.getElementById('readingFlowContainer').addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.add-vocab-trigger');
        if (targetBtn) {
            const word = targetBtn.getAttribute('data-word');
            const info = targetBtn.getAttribute('data-info');
            openInFloatingWidget(word, info);
        }
    });
});



        function exportAllData() {
            const backupData = { apiKey: state.apiKey, projects: state.projects, vocabulary: state.vocabulary, exportedAt: new Date().toLocaleString() };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `SmartReading_Backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importAllData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (!parsedData.projects || !parsedData.vocabulary) { alert('非法的备份文件格式！'); return; }
                    if (confirm('导入备份将会完全覆盖当前数据！是否继续？')) {
                        state.apiKey = parsedData.apiKey || '';
                        state.projects = parsedData.projects;
                        state.vocabulary = parsedData.vocabulary;
                        localStorage.setItem('gemini_api_key_v3', state.apiKey);
                        localStorage.setItem('reading_projects_v3', JSON.stringify(state.projects));
                        localStorage.setItem('reading_vocab_v3', JSON.stringify(state.vocabulary));
                        state.currentProject = null;
                        document.getElementById('activeProjectBadge').classList.add('hidden');
                        updateGlobalApiUI(); renderProjectTable(); renderVocabGrid(); renderReadingFlow();
                        alert('🎉 数据已完美恢复！');
                    }
                } catch (err) { alert('文件读取解析失败！'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        async function requestParaAIAnalysis(paraId) {
            if (!state.apiKey) { alert('请在板块1配置有效的 Gemini 密钥！'); return; }
            const loader = document.getElementById(`para-loader-${paraId}`);
            loader.classList.remove('hidden');
            const para = state.currentProject.paragraphs.find(p => p.id === paraId);
            if (!para) return;

            const systemPrompt = `你是一位精通多国语言的语言学导师。请对输入的段落进行深度精读分析。你必须且只能返回一个纯净、合法的 JSON 字符串对象，属性包含：trans_zh, trans_en, trans_canton, syntax, vocabs (结构为 {"word":"", "info":""} 的数组)。不要包含 \`\`\`json 等 Markdown 代码块标识。vocabs要包含发音、不同时态写法(仅英语)、中英文释义. `;
            const requestUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;
            const payload = { contents: [{ parts: [{ text: `${systemPrompt}\n\n目标段落：\n"""\n${para.text}\n"""` }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.2 } };

            try {
                const response = await fetch(requestUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) { const errData = await response.json(); throw new Error(errData.error?.message || `HTTP ${response.status}`); }
                const resData = await response.json();
                let rawText = resData.candidates[0].content.parts[0].text.trim();
                if (rawText.startsWith("```")) rawText = rawText.replace(/^```json\s*/i, "").replace(/```$/, "").trim();
                para.analysis = JSON.parse(rawText);
                localStorage.setItem('reading_projects_v3', JSON.stringify(state.projects));
                renderReadingFlow();
            } catch (error) {
                console.error(error); alert(`AI精读分析失败：${error.message}`);
            } finally { loader.classList.add('hidden'); }
        }

        function toggleFloatingWidget(shouldCollapse) {
            const expandedBox = document.getElementById('floatingWidgetExpanded');
            const collapsedBtn = document.getElementById('floatingWidgetCollapsed');
            if (shouldCollapse) { expandedBox.classList.add('hidden'); collapsedBtn.classList.remove('hidden'); }
            else { expandedBox.classList.remove('hidden'); collapsedBtn.classList.add('hidden'); }
        }

        function handleGlobalMouseSelection() {
            let selectedText = window.getSelection().toString().trim();
            if (selectedText.length > 0 && selectedText.length < 50 && state.currentPage === 'workbench') {
                document.getElementById('floatWord').value = selectedText;
            }
        }

        function openInFloatingWidget(word, info) {
            document.getElementById('floatingWidgetExpanded').classList.remove('hidden');
            document.getElementById('floatingWidgetCollapsed').classList.add('hidden');
            document.getElementById('floatWord').value = word;
            document.getElementById('floatMeaning').value = info;
            document.getElementById('floatingVocabContainer').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function submitFloatingVocab() {
            const word = document.getElementById('floatWord').value.trim();
            const lang = document.getElementById('floatLang').value;
            const meaning = document.getElementById('floatMeaning').value.trim();
            if (!word || !meaning) { alert('请填写完整！'); return; }
            state.vocabulary[lang].push({ word, meaning });
            state.vocabulary[lang].sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));
            localStorage.setItem('reading_vocab_v3', JSON.stringify(state.vocabulary));
            alert(`"${word}" 已保存！`);
            document.getElementById('floatWord').value = '';
            document.getElementById('floatMeaning').value = '';
            if (state.currentPage === 'vocabulary') renderVocabGrid();
        }

        function switchPage(pageId) {
            state.currentPage = pageId;
            ['workbench', 'vocabulary', 'projects'].forEach(p => {
                const el = document.getElementById(`page-${p}`);
                const navBtn = document.getElementById(`nav-${p}`);
                if (p === pageId) {
                    el.classList.remove('hidden');
                    navBtn.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-gray-50 text-indigo-600 hover:bg-indigo-700 hover:text-gray-100 dark:bg-indigo-600 dark:text-white transition flex items-center space-x-2";
                } else {
                    el.classList.add('hidden');
                    navBtn.className = "px-4 py-2 text-sm font-medium rounded-lg hover:bg-indigo-700 hover:text-gray-100  dark:hover:bg-zinc-700 transition flex items-center space-x-2";
                }
            });
            if (pageId === 'vocabulary') renderVocabGrid();
            if (pageId === 'projects') renderProjectTable();
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') { document.documentElement.classList.add('dark'); }
            else { document.documentElement.classList.remove('dark'); }
        }
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark');
            }
        }

        function updateGlobalApiUI() {
            const badge = document.getElementById('globalApiBadge');
            const input = document.getElementById('apiKeyInput');
            if (state.apiKey) {
                input.value = state.apiKey;
                badge.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full"></span><span>Gemini 已连接</span>`;
            } else {
                badge.innerHTML = `<span class="w-2 h-2 bg-gray-400 rounded-full"></span><span>Gemini 未接入</span>`;
            }
        }
        
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key.length > 0) { state.apiKey = key; localStorage.setItem('gemini_api_key_v3', key); updateGlobalApiUI(); alert('密钥已保存！'); }
            else { alert('请输入有效密钥！'); }
        }

        function handleSplitText() {
            const name = document.getElementById('projectNameInput').value.trim() || `未命名文献_${new Date().toLocaleDateString()}`;
            const text = document.getElementById('sourceTextInput').value.trim();
            if (!text) { alert('请贴入长文本！'); return; }
            const paragraphs = text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 0);
            const newProject = { id: 'p_' + Date.now(), name: name, paragraphs: paragraphs.map((content, idx) => ({ id: `p_para_${idx}_${Date.now()}`, text: content, note: '', analysis: null })), createdAt: new Date().toLocaleString() };
            state.projects.unshift(newProject);
            localStorage.setItem('reading_projects_v3', JSON.stringify(state.projects));
            document.getElementById('projectNameInput').value = '';
            document.getElementById('sourceTextInput').value = '';
            localStorage.removeItem('cached_project_name');
            localStorage.removeItem('cached_source_text');
            loadProjectOnWorkbench(newProject.id);
        }

        function loadProjectOnWorkbench(projId) {
            const project = state.projects.find(p => p.id === projId);
            if (!project) return;
            state.currentProject = project;
            const badge = document.getElementById('activeProjectBadge');
            badge.innerText = project.name; badge.classList.remove('hidden');
            switchPage('workbench'); renderReadingFlow();
        }

        function renderReadingFlow() {
            const container = document.getElementById('readingFlowContainer');
            container.innerHTML = '';
            if (!state.currentProject) {
                container.innerHTML = `<div class="text-center py-24"><i class="fa-solid fa-wand-magic text-4xl mb-4 block"></i><p>请在左侧贴入长文，体验一键拆分及卡片级多语种翻译精读面板。</p></div>`;
                return;
            }
            state.currentProject.paragraphs.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = "border rounded-xl p-5 shadow-xs space-y-4";
                card.style.backgroundColor = "var(--bg-global)";
                
                const header = `<div class="text-[11px] font-bold tracking-wider text-indigo-600 dark:text-indigo-400 uppercase">第 ${idx + 1} 段 (Paragraph)</div>`;
                const textHtml = `<div class="text-base font-serif leading-relaxed select-text">${p.text}</div>`;
                const noteHtml = `<div><label class="block text-xs font-semibold text-red-500 mb-1"><i class="fa-regular fa-bookmark"></i> 个人红色精读笔记：</label><textarea oninput="saveLiveNote('${p.id}', this.value)" rows="2" placeholder="系统检测到文字将自动呈现鲜红色..." class="note-input w-full text-sm p-2 border rounded-lg focus:ring-1 focus:ring-red-400 focus:outline-hidden font-medium">${p.note || ''}</textarea></div>`;
                const actionHtml = `<div class="flex items-center space-x-3"><button onclick="requestParaAIAnalysis('${p.id}')" class="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-1.5 px-3 rounded-md transition flex items-center space-x-1.5 dark:bg-zinc-700 dark:hover:bg-zinc-600 cursor-pointer"><i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i><span>提交本段进行 AI 精读分析</span></button><span id="para-loader-${p.id}" class="text-xs hidden"><i class="fa-solid fa-circle-notch animate-spin text-indigo-500"></i> Gemini 正在深度剖析本段语境中...</span></div>`;

                let analysisHtml = '';
                if (p.analysis) {
                    let vocabRows = '';
                    if (p.analysis.vocabs && p.analysis.vocabs.length > 0) {
                        vocabRows = p.analysis.vocabs.map(v => {
                            const safeWord = v.word.replace(/"/g, '&quot;'); const safeInfo = v.info.replace(/"/g, '&quot;');
                            return `<div class="flex justify-between items-center p-2 rounded-sm" style="background-color: var(--bg-card)"><div class="overflow-hidden mr-2"><strong class="text-indigo-600 dark:text-indigo-400 text-sm block md:inline">${v.word}</strong><span class="ml-0 md:ml-2 text-xs">${v.info}</span></div><button type="button" data-word="${safeWord}" data-info="${safeInfo}" class="add-vocab-trigger shrink-0 text-[10px] border px-2 py-1 rounded-md transition font-medium cursor-pointer"><i class="fa-solid fa-plus text-emerald-500"></i>收录</button></div>`;
                        }).join('');
                    }
                    analysisHtml = `<div class="border-t pt-4 mt-2 space-y-3">
                        <details class="group rounded-lg border" open style="background-color: var(--bg-card)"><summary class="list-none flex justify-between items-center p-3 text-xs font-bold cursor-pointer"><span><i class="fa-solid fa-language text-blue-500 mr-1.5"></i> 本段地道翻译内容</span><i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i></summary><div class="p-3 text-xs space-y-2.5 leading-relaxed"><div><span class="font-bold mr-1">[原文]:</span> <span>${p.analysis.trans_zh || ''}</span></div><div><span class="font-bold mr-1">[中/英翻译]:</span> <span class="italic font-serif">${p.analysis.trans_en || ''}</span></div><div class="p-2 rounded-md border" style="background-color: var(--bg-global)"><span class="font-bold text-amber-600 mr-1">[粤语流利翻译]:</span> <span>${p.analysis.trans_canton || ''}</span></div></div></details>
                        <details class="group rounded-lg border" style="background-color: var(--bg-card)"><summary class="list-none flex justify-between items-center p-3 text-xs font-bold cursor-pointer"><span><i class="fa-solid fa-chart-simple text-purple-500 mr-1.5"></i> 本段重要句型结构分析</span><i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i></summary><div class="p-3 text-xs whitespace-pre-line leading-relaxed">${p.analysis.syntax || ''}</div></details>
                        <details class="group rounded-lg border" style="background-color: var(--bg-card)"><summary class="list-none flex justify-between items-center p-3 text-xs font-bold cursor-pointer"><span><i class="fa-solid fa-wand-magic text-emerald-500 mr-1.5"></i> 本段重难点词汇推荐</span><i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i></summary><div class="p-3 text-xs space-y-2.5">${vocabRows}</div></details>
                    </div>`;
                }
                card.innerHTML = header + textHtml + noteHtml + actionHtml + analysisHtml;
                container.appendChild(card);
            });
        }

        function saveLiveNote(paraId, text) { if (!state.currentProject) return; const para = state.currentProject.paragraphs.find(p => p.id === paraId); if (para) { para.note = text; localStorage.setItem('reading_projects_v3', JSON.stringify(state.projects)); } }

        function switchVocabTab(lang) {
            state.currentVocabTab = lang;
            ['EN', 'ZHO'].forEach(l => {
                const btn = document.getElementById(`tab-${l}`);
                if (l === lang) { btn.className = "px-4 py-1.5 text-xs font-semibold bg-white text-indigo-800 rounded-md shadow-xs dark:bg-zinc-700 dark:text-white cursor-pointer"; }
                else { btn.className = "px-4 py-1.5 text-xs font-medium rounded-md cursor-pointer"; }
            });
            renderVocabGrid();
        }

        function renderVocabGrid() {
           const container = document.getElementById('vocabGridContainer'); container.innerHTML = '';
            let list = state.vocabulary[state.currentVocabTab] || [];
            const keyword = document.getElementById('vocabSearchInput')?.value.toLowerCase() || '';
          if (keyword) {
        list = list.filter(item => {
            // 确保单词存在并转为小写（假设你的单词字段叫 item.word）
            const word = item.word ? item.word.toLowerCase() : '';
            
            // 使用 startsWith 检查单词是否以输入的关键字开头
            return word.startsWith(keyword);
        });
    }
          
            if (list.length === 0) { container.innerHTML = `<div class="col-span-full text-center py-12">没有找到匹配的词汇记录。</div>`; return; }
            list.forEach((item, index) => {
                const card = document.createElement('div'); card.className = "p-4 rounded-xl border flex justify-between items-start";
                card.style.backgroundColor = "var(--bg-global)";
                card.innerHTML = `<div><div class="text-base font-bold text-indigo-600 dark:text-indigo-400">${item.word}</div><div class="text-xs mt-1 leading-relaxed">${item.meaning}</div></div><button onclick="removeVocabCard('${index}')" class="text-gray-300 hover:text-red-500 p-1 transition cursor-pointer"><i class="fa-solid fa-trash-can text-xs"></i></button>`;
                container.appendChild(card);
            });
        }

        function removeVocabCard(index) { state.vocabulary[state.currentVocabTab].splice(index, 1); localStorage.setItem('reading_vocab_v3', JSON.stringify(state.vocabulary)); renderVocabGrid(); }

      function renderProjectTable() {
    const container = document.getElementById('projectTableContainer');
    let list = state.projects || [];
    const keyword = document.getElementById('projectSearchInput')?.value.toLowerCase() || '';
    
    // ======= 💡 已经把之前放错的错误代码从这里删除了 =======

    if (keyword) { list = list.filter(p => p.name.toLowerCase().includes(keyword)); }
    if (list.length === 0) { container.innerHTML = `<div class="text-center py-12">没有找到匹配的精读项目。</div>`; return; }
    
    let html = `<table class="w-full text-left border-collapse"><thead><tr class="border-b text-xs uppercase tracking-wider"><th class="pb-3 font-semibold">文献/项目名称</th><th class="pb-3 font-semibold">拆分段落数</th><th class="pb-3 font-semibold">归档时间</th><th class="pb-3 font-semibold text-right">管理操作</th></tr></thead><tbody class="divide-y text-sm">`;
    
    list.forEach(p => {
        // ======= 💡 注意下面“挂载工作台”按钮的 onclick 属性 =======
        // 我们在原本的 loadProjectOnWorkbench('${p.id}') 后面加了一个分号 ; 
        // 然后顺便调用 window.loadProjectToInput('${p.name}')，把当前项目的名字传进去
        html += `<tr class="hover:bg-gray-50/50 dark:hover:bg-zinc-900/30 transition">
            <td class="py-4 font-semibold">${p.name}</td>
            <td class="py-4">${p.paragraphs.length} 段</td>
            <td class="py-4 text-xs">${p.createdAt}</td>
            <td class="py-4 text-right space-x-2">
                <button onclick="loadProjectOnWorkbench('${p.id}'); if(typeof window.loadProjectToInput==='function'){window.loadProjectToInput('${p.name}')}" class="text-xs bg-indigo-600 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-md transition cursor-pointer">
                  打开
                </button>
                <button onclick="purgeProjectArchive('${p.id}')" class="text-xs bg-gray-100 hover:bg-red-50 hover:text-red-600 dark:bg-zinc-700 text-white dark:text-white px-3 py-1.5 rounded-md transition cursor-pointer">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </td>
        </tr>`;
    });
    
    html += `</tbody></table>`; 
    container.innerHTML = html;
}

        function purgeProjectArchive(id) { if (!confirm('确定彻底清除该精读归档项目吗？')) return; state.projects = state.projects.filter(p => p.id !== id); localStorage.setItem('reading_projects_v3', JSON.stringify(state.projects)); if (state.currentProject && state.currentProject.id === id) { state.currentProject = null; document.getElementById('activeProjectBadge').classList.add('hidden'); } renderProjectTable(); }
    </script>
</body>
</html>
