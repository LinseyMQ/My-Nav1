## 1. 语序
中文是 **SVO**（主-谓-宾）语言，语序非常固定。
- **基本结构**：主语 + 谓语 + 宾语  
  >例：我 爱 你。
- **定语**：放在名词前 

  >例：美丽的 花。
- **状语**：放在动词/形容词前  
  >例：很快地 跑。
- **补语**：放在动词/形容词后  
  >例：跑得 很快。

## 2. 词类

### 2.1 名词
- 可受数量词、指示代词修饰，一般不受副词修饰。
- 无性、数、格变化（复数可用“们”表示，限于人称代词和少量名词）。
  - >例：同学们、我们
- 方位名词：上、下、里、外、前、后、左、右、东、西等。

### 2.2 动词
- 可受“不、没、很”等修饰，可带“了、着、过”。
- 特殊动词：
  - 判断动词：是
  - 能愿动词：能、会、可以、应该、愿意、敢等
  - 趋向动词：来、去、上、下、进、出、回、过等

### 2.3 形容词
- 表示性质或状态，可受程度副词修饰（很、非常等）。
- 可作谓语、定语、状语、补语。
- 重叠形式：高高（的）、慢慢（地）、红红（的）

### 2.4 数词
- 基数、序数、概数（两、几、多、余）。
- 量词必用：一个人、三本书、五匹马。

### 2.5 量词
- 个体量词：个、本、只、条、张、把
- 度量衡量词：米、公斤、升
- 临时量词：杯、盒、碗
- 动量词：次、回、遍、趟、下

### 2.6 代词
- 人称代词：我、你、他/她/它、我们、你们、他们、自己、别人
- 指示代词：这、那、这些、那些、这儿、那儿
- 疑问代词：谁、什么、哪、怎么、怎样、多少、几

### 2.7 副词
- 程度：很、非常、极、太、特别、稍微
- 范围：都、全、只、就、仅仅

- 情态/语气：也许、大概、一定、居然、果然

### 2.8 介词
- 引出时间、地点、工具、原因、对象等。
- 常见：在、从、到、对、对于、关于、比、用、以、为了、除了

### 2.9 连词
- 并列：和、跟、与、及、以及
- 承接：于是、然后、接着
- 转折：但是、可是、然而、不过
- 因果：因为…所以…、既然…就…
- 条件：如果…就…、只要…就…、只有…才…
- 让步：即使…也…、尽管…还是…

### 2.10 助词
- 结构助词：的、地、得  
  >例：美丽的风景（定语） | 慢慢地走（状语） | 跑得很快（补语）*
- 动态助词：了（完成）、着（持续）、过（经历）
- 语气助词：的、了、吗、呢、吧、啊、嘛、啦

### 2.11 叹词与拟声词
- 叹词：啊、哎呀、哦、喂（独立成句）
- 拟声词：哗啦、轰隆、叽叽喳喳

## 3. 句子成分

| 成分 | 说明 | 例 |
| :--- | :--- | :--- |
| 主语 | 话题或动作发出者 | **他** 在看书 |
| 谓语 | 对主语进行陈述 | 他 **在看** 书 |
| 宾语 | 动作的承受者 | 他在看 **书** |
| 定语 | 修饰名词 | **红色** 的苹果 |
| 状语 | 修饰动词/形容词 | **很快** 地跑 |
| 补语 | 补充说明动作或状态 | 跑 **得快** / 好 **极了** |

## 4. 特殊句法结构

### 4.1 “把”字句（处置式）
- 结构：主语 + 把 + 宾语 + 动词 + 其他  
  >例：我把书放在桌子上。

### 4.2 “被”字句（被动句）
- 结构：受事 + 被（+ 施事） + 动词 + 其他  
  >例：书被他拿走了。

### 4.3 连动句
- 同一个主语连续发出两个或以上动作。  
  >例：我去商店买东西。

### 4.4 兼语句
- 第一个动词的宾语是第二个动词的主语。  
  >例：老师让我回答问题。

### 4.5 存现句
- 表示存在、出现、消失。  
  >例：桌子上有一本书。  
  >例：前面走来一个人。

### 4.6 比较句
- “比”字句：A比B + 形容词  
  >例：他比我高。
- 更/还：他比我更高/还高。
- 不如/没有：我不如他努力。

### 4.7 是…的 结构
- 强调时间、地点、方式等。  
  >例：我是昨天来的。  
  >例：他是坐飞机去的。

## 5. 疑问句形式

| 类型 | 结构 | 例 |
|------|------|----|
| 是非问 | 陈述句 + 吗 | 你好吗？ |
| 正反问 | V不V / A不A | 你去不去？ |
| 特指问 | 疑问代词 | 你是谁？ |
| 选择问 | 还是 | 你去还是我去？ |
| 反问句 | 难道…吗？ / 怎么…呢？ | 难道你不知道吗？ |

## 6. 时体表达

中文无时态（tense），但通过**体（aspect）**和**时间词**表达。

| 体 | 标记 | 例 |
|----|------|----|
| 完成体 | 了 | 我吃了饭。 |
| 经历体 | 过 | 我去过北京。 |
| 进行体 | 在 / 正 / 着 | 他在唱歌 / 门开着呢。 |
| 持续体 | 着 | 他站着不动。 |
| 将要发生 | 要…了 / 快…了 | 要下雨了。 |

## 7. 复句类型

- **并列**：既…又… / 一边…一边…
- **承接**：首先…然后… / …接着…
- **递进**：不但…而且…
- **选择**：或者…或者… / 要么…要么…
- **转折**：虽然…但是…
- **因果**：因为…所以… / 既然…就…
- **条件**：只要…就… / 只有…才…
- **假设**：如果…就… / 要是…就…
- **目的**：为了… / 以便…

## 8. 常见语法错误（供学习参考）

1. **语序错误**（受母语影响）：  
   ❌ 我昨天去商店。  
   ✅ 我昨天去了商店。（缺“了”表示完成）

2. **遗漏量词**：  
   ❌ 一人

3. **“的 / 地 / 得”混用**：  
   ❌ 跑的很快  
   ✅ 跑得很快

4. **“不”与“没”误用**：

   ✅ 我昨天没吃饭。

5. **“是”的滥用**：  
   ❌ 我是很高兴。

6. **动态助词“了”的位置不当**：  
   ❌ 我吃饭了以后去。  
   ✅ 我吃了饭以后去。

 markdown: `# 📘 英语核心语法大全



## 1. 语序（基本句型）

英语是 **SVO（主语-谓语-宾语）** 语言，语序相对固定。

| 时态 | 结构 | 例 |
|------|------|----|

## 4. 语态

- **主动语态**：主语执行动作  
  >例：The dog bit the man.
- **被动语态**：be + 过去分词 + (by)  
  >例：The man was bitten by the dog.*

## 5. 语气

- **陈述语气**：陈述事实
- **祈使语气**：命令或请求
- **虚拟语气**
  - 与现在相反：If + 过去式 (were), ... would/could/might + 动词原形  
    *If I were you, I would go.*
  - 与过去相反：If + had done, ... would/could + have done  
    *If I had known, I would have told you.*
  - 与将来相反：If + should/were to, ... would + 动词原形
  - 建议/命令/要求：动词 + that + (should) + 动词原形

- **不定式**：to + 动词原形  
  *I want to go.
- **动名词**：动词-ing（作名词）

- **现在分词**：动词-ing（主动/进行）  
  *a crying baby
- **过去分词**：动词-ed（被动/完成）  
  *a broken window*

## 7. 句子成分

| 成分 | 说明 | 例 |
|------|------|----|
| 主语 | 动作或状态的主题 | **The cat** sleeps. |
| 谓语 | 主语发出的动作或状态 | The cat **sleeps**. |
| 宾语 | 动作的承受者 | I love **you**. |
| 表语 | 系动词后的成分 | She is **beautiful**. |
| 定语 | 修饰名词 | **red** apple |
| 状语 | 修饰动词/形容词/副词 | He runs **fast**. |
| 补足语 | 补充说明宾语或主语 | They elected him **president**. |

## 8. 从句

- **名词性从句**（主语/宾语/表语/同位语）  
  *What he said is true.
- **定语从句**（关系代词 who, whom, which, that, whose；关系副词 where, when, why）  
  *The book that I bought is good.
- **状语从句**（时间、原因、条件、让步、目的、结果、比较、地点、方式）  
  *If it rains, we will stay home.*

## 9. 特殊句型

- **倒装句**
  - 完全倒装：Here comes the bus.
  - 部分倒装：Never have I seen such a thing.
- **强调句**：It is/was + 被强调部分 + that/who + 其余部分  
  *It was yesterday that I met him.
- **there be 句型**：表示存在  
  *There is a book on the table.*

## 10. 主谓一致

- 语法一致（主语单数则谓语单数）
- 意义一致（集合名词 family, team 按意义）
- 就近原则（either...or, neither...nor, not only...but also）

## 1. 语序（基本特征）

日语是 **SOV（主语-宾语-谓语）** 语言，与汉语/英语语序不同。

- **基本结构**：主语 + 宾语 + 谓语  
  >例：私 は リンゴ を 食べる。（我吃苹果）
- **修饰语在前**：定语、状语放在被修饰词之前
- **谓语在句尾**：这是日语最固定的语法特征

## 2. 十大词类（品詞）

### 2.1 动词（動詞）
- **五段动词（一类动词）**：以う段假名结尾，如 書く、話す、飲む
- **一段动词（二类动词）**：以「る」结尾，前一个假名是い段或え段，如 見る、食べる
- **サ変动词（三类动词）**：する（做）
- **カ変动词（三类动词）**：来る（来）

### 2.2 形容词（形容詞）
- **イ形容词**：以「い」结尾，如 赤い、楽しい、高い  
  活用变化：赤い → 赤くない（否定） → 赤かった（过去）
- **ナ形容词（形容動詞）**：以「だ」为基本形，如 静かだ、綺麗だ  
  作定语时加「な」：静かな場所

### 2.3 名词（名詞）
- 无性、数、格变化
- 可加助词充当各种成分
- 时间名词可接助词「に」表示时间点

### 2.4 代词（代名詞）
- 人称代词：私（我）、あなた（你）、彼（他）、彼女（她）、私たち（我们）
- 指示代词：これ（这个）、それ（那个）、あれ（那个远处）、どれ（哪个）

### 2.5 数词（数詞）
- 基数词：一（いち）、二（に）、三（さん）...
- 量词种类丰富（個、本、枚、匹、人、台、冊、杯、回等）
- 数字+量词常有音变：一本（いっぽん）、三杯（さんばい）

### 2.6 副词（副詞）
- 修饰动词、形容词或其他副词
- 类型：程度（とても、少し）、时间（すぐ、もう）、频率（よく、たまに）、情态（はっきり、ゆっくり）
- 拟声拟态词：どんどん、きらきら、わくわく、ぐっすり

### 2.7 连体词（連体詞）
- 只能修饰名词，不能单独使用
- 例：この（这个）、その（那个）、あの（那个）、どの（哪个）、大きな（大的）、小さな（小的）

### 2.8 接续词（接続詞）
- 连接句子或段落
- 并列：そして、および
- 转折：しかし、でも、けれども
- 因果：だから、それで、そのため
- 添加：それに、しかも

### 2.9 感叹词（感動詞）
- 独立使用，不参与句子结构
- 例：ああ、おお、えっ、さあ、はい、いいえ、こんにちは

### 2.10 助词（助詞）—— 日语核心
- **格助词**：が（主格）、を（宾格）、に（方向/时间/目的）、へ（方向）、と（一起/引用）、から（起点）、まで（终点）、で（场所/手段）
- **副助词**：は（主题）、も（也）、だけ（只）、しか（只，与否定连用）、ほど（程度）、くらい（大约）
- **终助词**：か（疑问）、ね（确认/感叹）、よ（告知）、わ（女性语气）、ぞ（男性语气）
- **接续助词**：て（连接）、ながら（一边）、ので（因为）、のに（虽然）

## 3. 动词活用（基本形 → 连用形 → 未然形等）

| 动词类型 | 基本形 | 连用形（ます形） | て形 | た形 | 否定形（ない形） | 假定形（ば形） | 意志形（よう形） |
|----------|--------|-----------------|------|------|-----------------|---------------|-----------------|
| 五段（書く） | 書く | 書き | 書いて | 書いた | 書かない | 書けば | 書こう |
| 一段（食べる） | 食べる | 食べ | 食べて | 食べた | 食べない | 食べれば | 食べよう |
| サ変（する） | する | し | して | した | しない | すれば | しよう |
| カ変（来る） | くる | き | きて | きた | こない | くれば | こよう |

## 4. 形容词活用

| 类型 | 基本形 | 否定形 | 过去形 | て形 | 副词化 |
|------|--------|--------|--------|------|--------|
| イ形容词 | 楽しい | 楽しくない | 楽しかった | 楽しくて | 楽しく |
| ナ形容词 | 静かだ | 静かではない | 静かだった | 静かで | 静かに |

## 5. 助词详解（核心语法）

### 5.1 が vs は
- **が**：强调主语、新信息、客观描述  
  >例：雨が降っている。（正在下雨）
- **は**：强调主题、旧信息、对比  
  >例：私は日本人です。（我是日本人）*

### 5.2 に vs で
- **に**：存在地点（いる/ある）、时间点、动作方向、目的  
  >例：学校にいる。（在学校）| 3時に会う。（3点见面）
- **で**：动作场所、手段、范围  
  >例：教室で勉強する。（在教室学习）| バスで行く。（坐公交去）*

### 5.3 を
- 表示他动词的宾语  
  >例：本を読む。（读书）*
- 表示移动经过的场所  
  >例：道を歩く。（在路上走）*

## 6. 时态与体（テンス・アスペクト）

| 形式 | 意义 | 例 |
|------|------|----|
| る形（非过去肯定） | 现在/将来 | 食べる（吃/将吃） |
| た形（过去肯定） | 过去 | 食べた（吃了） |
| ない形（非过去否定） | 现在/将来否定 | 食べない（不吃） |
| なかった（过去否定） | 过去否定 | 食べなかった（没吃） |
| ている | 进行/状态/习惯 | 食べている（正在吃） |
| てしまう | 完成/遗憾 | 食べてしまった（吃完了/不该吃的吃了） |
| ておく | 提前准备 | 食べておく（提前吃好） |
| てみる | 尝试做 | 食べてみる（试着吃） |

## 7. 敬语体系（敬語）—— 日语特色

### 7.1 尊他语（尊敬語）
- 抬高对方动作
- 特殊动词：行く→いらっしゃる、言う→おっしゃる、する→なさる
- 公式：お + 连用形 + になる  
  >例：お読みになる（阅读）*

### 7.2 自谦语（謙譲語）
- 降低自己动作
- 特殊动词：行く→参る、言う→申す、する→いたす
- 公式：お + 连用形 + する  
  >例：お届けする（为您送去）*

### 7.3 郑重语（丁寧語）
- 礼貌体：です・ます
- 例：行きます（去）、食べます（吃）、綺麗です（漂亮）

### 7.4 敬语对照表

| 普通形 | ます形（郑重） | 尊他语 | 自谦语 |
|--------|---------------|--------|--------|
| 行く | 行きます | いらっしゃる | 参る |
| 来る | 来ます | いらっしゃる | 参る |
| いる | います | いらっしゃる | おる |
| 言う | 言います | おっしゃる | 申す |
| する | します | なさる | いたす |
| 食べる | 食べます | お召し上がりになる | 頂く |
| 見る | 見ます | ご覧になる | 拝見する |

## 8. 句型结构

### 8.1 判断句
- A は B です。（A是B）  
  >例：私は学生です。
- A は B ではありません。（A不是B）

### 8.2 存在句
- 場所 に 物/人 が ある/いる。（某处有某物/某人）  
  >例：部屋に机がある。
- 物/人 は 場所 に ある/いる。（某物/某人在某处）  
  >例：猫は庭にいる。

### 8.3 描述句
- 主语 は 形容词/形容动词 です。  
  >例：花は美しい。

### 8.4 比较句
- A は B より + 形容词（A比B更...）  
  >例：日本は中国より小さい。
- A と B と どちらが + 形容词（A和B哪个更...）
- A は B ほど + 否定（A不如B）  
  >例：今日は昨日ほど暑くない。

## 9. 条件表达

| 形式 | 用法 | 例 |
|------|------|----|
| ば | 一般条件/恒常 | 春になれば花が咲く。 |
| たら | 假定条件/特定情况 | 雨が降ったら行かない。 |
| と | 必然结果/习惯 | ボタンを押すと電気がつく。 |
| なら | 主题提示/建议前提 | 行くなら、早く起きなさい。 |

## 10. 授受动词（やりもらい）

| 方向 | 给予者视角 | 接受者视角 |
|------|-----------|-----------|
| 我 → 他人 | あげる | さしあげる（尊他） |
| 他人 → 我 | くれる | くださる（尊他） |
| 他人 → 他人 | やる（给下级/动植物） | あげる |

>例：友達にプレゼントをあげた。（送给朋友礼物）*  
>例：母がケーキをくれた。（妈妈给了我蛋糕）*

## 11. 被动与使役

### 11.1 被动（受身）
- 结构：动词未然形 + れる/られる
- 例：食べる → 食べられる（被吃）
- 例：先生に褒められた。（被老师表扬了）

### 11.2 使役（使役）
- 结构：动词未然形 + せる/させる
- 例：食べる → 食べさせる（让...吃）
- 例：子供に宿題をさせた。（让孩子做作业）

### 11.3 使役被动（使役受身）
- 结构：使役形 + られる
- 表示被迫做某事
- 例：飲む → 飲まされる（被迫喝）

## 12. 句子连接与接续

### 12.1 て形连接
- 并列、顺序、原因  
  >例：起きて、顔を洗って、朝ごはんを食べた。（起床→洗脸→吃早饭）*

### 12.2 连用形（ます形去ます）+ ながら
- 一边...一边...  
  >例：音楽を聴きながら走る。（边听歌边跑）*

### 12.3 简体型 + ので / のに
- ので：客观原因（因为）  
- のに：转折（虽然...却...）  

### 12.4 简体型 + から / けど
- から：主观原因  
- けど：转折/铺垫

## 13. 常用终助词

| 终助词 | 意义 | 例 |
|--------|------|----|
| か | 疑问 | 行くか？（去吗？） |
| ね | 确认/感叹 | いい天気ですね。（天气真好呢） |
| よ | 告知/强调 | 行くよ！（我去哦！） |
| わ | 女性语气 | すてきだわ。（真美啊） |
| ぞ | 男性强调 | 行くぞ！（走啦！） |
| な | 禁止/感叹 | 触るな！（别碰！） / 困ったな。（真麻烦啊） |

## 14. 常见语法错误提示

- ❌ 助词混淆：私**は**リンゴ**に**食べる。  
  ✅ 私**は**リンゴ**を**食べる。
- ❌ 形容词时态错误：昨日は楽しい。  
  ✅ 昨日は楽しかった。
- ❌ 自动词他动词混淆：ドアを開く（开门，自动词误用）。  
  ✅ ドア**を**開ける（他动词） / ドア**が**開く（自动词）。
- ❌ 存在句场所助词误用：学校**を**本がある。  
  ✅ 学校**に**本がある。
- ❌ 授受动词方向错误：私が友達にプレゼントをくれた。  
  ✅ 友達**が**私にプレゼントをくれた / 私**は**友達**に**プレゼントをあげた。

## 15. 总结：日语语法核心要点

1. **语序 SOV**：谓语在最后
2. **助词决定语法关系**：が/を/に/で/は 是灵魂
3. **活用系统**：动词、形容词有规律变化
4. **敬语三分类**：尊他语、自谦语、郑重语
5. **授受动词**：あげる・くれる・もらう 体现内外关系
6. **简体与敬体**：日常对话用简体，正式场合用です・ます
7. **テンス・アスペクト**：た・ている・てしまう 等体标记
8. **条件表达四形式**：ば・たら・と・なら 各有用法

# 西班牙语语法全面整理

## 1. 语序（基本特征）

西班牙语是 **SVO（主语-谓语-宾语）** 语言，但语序比英语灵活。

- **基本结构**：主语 + 谓语 + 宾语  
  *例：Yo como manzanas.（我吃苹果）*
- **主语可省略**：因为动词变位已体现人称  
  *例：Como manzanas.（我吃苹果）—— Yo 可省略*
- **形容词后置**：一般放在名词之后  
  *例：una casa grande（一个大房子）*
- **疑问句**：主语与动词倒装或语调上升  
  *例：¿Comes manzanas?（你吃苹果吗？）*

## 2. 名词（Sustantivos）

### 2.1 性（Género）
- **阳性（masculino）**：以 -o 结尾居多  
  *例：el niño（男孩）, el libro（书）*
- **阴性（femenino）**：以 -a 结尾居多  
  *例：la niña（女孩）, la mesa（桌子）*
- **例外**：el día（天，阳性）, la mano（手，阴性）, el problema（问题，阳性）
- **以 -ista / -ante 结尾**：阴阳同形，由冠词区分  
  *例：el/la turista（游客）, el/la estudiante（学生）*

### 2.2 数（Número）
- **复数变化**：
  - 元音结尾 + s：casa → casas
  - 辅音结尾 + es：papel → papeles
  - z 结尾：z → ces：luz → luces

## 3. 冠词（Artículos）

| 类型 | 阳性单数 | 阳性复数 | 阴性单数 | 阴性复数 |
|------|----------|----------|----------|----------|
| 定冠词（the） | el | los | la | las |
| 不定冠词（a/an/some） | un | unos | una | unas |

*例：el perro（那只狗）, un perro（一只狗）*

## 4. 形容词（Adjetivos）

### 4.1 性与数一致
- 形容词必须与名词保持性、数一致  
  *例：un niño alto（一个高个子男孩）*  
  *例：unas niñas altas（几个高个子女孩）*

### 4.2 位置规则
- **一般后置**：描述分类  
  *例：una película interesante（一部有趣的电影）*
- **前置（改变含义或强调）**：  
  *例：un gran hombre（一个伟大的人） vs un hombre grande（一个大个子男人）*

### 4.3 比较级与最高级

| 类型 | 结构 | 例 |
|------|------|----|
| 比较级（更高） | más + adj. + que | Juan es más alto que Luis. |
| 比较级（更低） | menos + adj. + que | Juan es menos alto que Luis. |
| 相等（同等） | tan + adj. + como | Juan es tan alto como Luis. |
| 最高级 | el/la/los/las + más + adj. + de | Es la más inteligente de la clase. |
| 绝对最高级 | ísimo 后缀 | guapísimo（非常帅） |

### 4.4 特殊比较级（不规则）

| 原级 | 比较级 | 最高级 |
|------|--------|--------|
| bueno（好） | mejor（更好） | óptimo / el mejor |
| malo（坏） | peor（更坏） | pésimo / el peor |
| grande（大） | mayor（更大/年长） | máximo / el mayor |
| pequeño（小） | menor（更小/年轻） | mínimo / el menor |

## 5. 代词（Pronombres）

### 5.1 人称代词（主语）

| 人称 | 单数 | 复数 |
|------|------|------|
| 1ª | yo（我） | nosotros（我们，男/混合）/ nosotras（我们，女） |
| 2ª | tú（你，非正式） / usted（您，正式） | vosotros（你们，非正式，西班牙）/ ustedes（你们，正式/拉美） |
| 3ª | él（他）, ella（她） | ellos（他们，男/混合）, ellas（她们） |

### 5.2 直接宾语代词（宾格）

| 人称 | 单数 | 复数 |
|------|------|------|
| 1ª | me | nos |
| 2ª | te | os |
| 3ª | lo（他/它，阳）, la（她/它，阴） | los（阳）, las（阴） |

*例：Veo el libro → Lo veo.（我看见书 → 我看见它）*

### 5.3 间接宾语代词（与格）

| 人称 | 单数 | 复数 |
|------|------|------|
| 1ª | me | nos |
| 2ª | te | os |
| 3ª | le（他/她/您） | les（他们/她们/你们） |

*例：Doy el libro a Juan → Le doy el libro.（我给胡安书 → 我给他书）*

### 5.4 双重代词（间接 + 直接）
- 顺序：间接宾语代词 → 直接宾语代词
- le/les 与 lo/la/los/las 连用时变为 **se**  
  *例：Le doy el libro → Se lo doy.（我把书给他）*

### 5.5 反身代词

| 人称 | 单数 | 复数 |
|------|------|------|
| 1ª | me | nos |
| 2ª | te | os |
| 3ª | se | se |

*例：Me lavo.（我洗澡）*

### 5.6 介词宾语代词（前置格）
- mí（我）, ti（你）, sí（自己）, él, ella, ello, nosotros, vosotros, ellos, ellas
- 特殊：con + mí → conmigo（和我）, con + ti → contigo（和你）, con + sí → consigo（和自己）

## 6. 动词（Verbos）—— 核心语法

### 6.1 动词变位概述
西班牙语动词分为三类：**-ar, -er, -ir**，根据不同时态和人称进行变位。

### 6.2 规则动词变位（以 hablar, comer, vivir 为例）

#### 陈述式现在时（Presente de Indicativo）

| 人称 | hablar（说） | comer（吃） | vivir（住） |
|------|-------------|-------------|-------------|
| yo | hablo | como | vivo |
| tú | hablas | comes | vives |
| él/ella/usted | habla | come | vive |
| nosotros | hablamos | comemos | vivimos |
| vosotros | habláis | coméis | vivís |
| ellos/ellas/ustedes | hablan | comen | viven |

#### 简单过去时（Pretérito Perfecto Simple）

| 人称 | hablar | comer | vivir |
|------|--------|-------|-------|
| yo | hablé | comí | viví |
| tú | hablaste | comiste | viviste |
| él | habló | comió | vivió |
| nosotros | hablamos | comimos | vivimos |
| vosotros | hablasteis | comisteis | vivisteis |
| ellos | hablaron | comieron | vivieron |

#### 过去未完成时（Pretérito Imperfecto）

| 人称 | hablar | comer | vivir |
|------|--------|-------|-------|
| yo | hablaba | comía | vivía |
| tú | hablabas | comías | vivías |
| él | hablaba | comía | vivía |
| nosotros | hablábamos | comíamos | vivíamos |
| vosotros | hablabais | comíais | vivíais |
| ellos | hablaban | comían | vivían |

#### 将来时（Futuro Simple）
- 所有动词在词尾直接加：-é, -ás, -á, -emos, -éis, -án
*例：hablar → hablaré（我将会说）*

#### 现在完成时（Pretérito Perfecto Compuesto）
- 结构：haber（现在时）+ 过去分词
*例：he hablado（我说过）*

### 6.3 重要不规则动词

| 原形 | 现在时 yo | 简单过去时 yo | 过去分词 |
|------|-----------|---------------|----------|
| ser（是） | soy | fui | sido |
| ir（去） | voy | fui | ido |
| estar（在/状态） | estoy | estuve | estado |
| tener（有） | tengo | tuve | tenido |
| hacer（做） | hago | hice | hecho |
| decir（说） | digo | dije | dicho |
| venir（来） | vengo | vine | venido |
| poder（能） | puedo | pude | podido |
| poner（放） | pongo | puse | puesto |
| saber（知道） | sé | supe | sabido |

### 6.4 常用时态对照表

| 时态 | 用法 | 例 |
|------|------|----|
| 现在时 | 现在动作/习惯/事实 | Hablo español. |
| 简单过去时 | 过去完成的一次性动作 | Ayer comí pizza. |
| 过去未完成时 | 过去习惯/背景描述 | Cuando era niño, jugaba fútbol. |
| 现在完成时 | 与现在相关的过去动作 | Hoy he comido bien. |
| 将来时 | 将来动作 | Mañana estudiaré. |
| 近将来时 | ir a + 原形 | Voy a estudiar. |
| 命令式 | 命令/请求 | ¡Habla más despacio! |

### 6.5 虚拟式（Subjuntivo）—— 西语特色

#### 虚拟式现在时（Presente de Subjuntivo）
- 构成：以现在时 yo 形去 -o，加反义词尾
- -ar 动词：-e, -es, -e, -emos, -éis, -en
- -er/-ir 动词：-a, -as, -a, -amos, -áis, -an

*例：hablar → hable, comamos, vivas*

#### 虚拟式用法
- **意愿/请求**：Quiero que vengas.（我想让你来）
- **情感/惊讶**：Me alegra que estés bien.（很高兴你还好）
- **否定/怀疑**：No creo que sea cierto.（我不相信是真的）
- **目的/条件**：Te lo digo para que lo sepas.（我告诉你让你知道）

## 9. 句式结构

### 9.1 否定句
- 把 no 放在动词前
*例：No como carne.（我不吃肉）*

### 9.2 疑问句
- 用 ¿...? 前后加问号
- 语序可变为动词 + 主语
*例：¿Hablas español?（你说西班牙语吗？）*

### 9.3 感叹句
- 用 ¡...! 前后加感叹号
*例：¡Qué bonito!（真漂亮！）*

### 9.4 比较句
- 比较级：Más... que, menos... que
- 最高级：el/la más... de

## 14. 常见语法错误提示

- ❌ 双重否定混淆：No tengo nada. 已含否定，不再加 no
  ✅ No tengo nada.（我什么都没有）—— 西语允许双重否定
- ❌ 前置词 de 多余：Acabo de llegar 已是完成时，不用再加 de
  ✅ Acabo de llegar.（我刚到）
- ❌ 形容词比较级后不加 que 或 de：Juan es más alto Luis
  ✅ Juan es más alto **que** Luis.
- ❌ Hace 时间表达顺序错误：Tengo dos años que estudio español
  ✅ **Hace** dos años que estudio español.（我学西语两年了）
- ❌ 动词变位遗漏主语后又变位错误：Ella viven aquí
  ✅ Ella **vive** aquí. / Ellas **viven** aquí.

### 17.2 虚拟式用法总结

| 用法 | 结构 | 例 |
|------|------|----|
| 意愿/请求 | Querer que + Subj. | Quiero que **vengas**. |
| 情感 | Alegrarse de que + Subj. | Me alegro de que **estés** bien. |
| 否定/怀疑 | No creer que + Subj. | No creo que **sea** cierto. |
| 目的 | Para que + Subj. | Te lo digo para que **lo sepas**. |
| 让步 | Aunque + Subj.（不确定） | Aunque **llueva**, iré. |
| 条件 | Si + Subj. 不成立 | Si **viniera**, ... |
| 推荐/建议 | Recomendar que + Subj. | Recomiendo que **lo hagas**. |
| 可能/评价 | Es posible que + Subj. | Es posible que **llegue** tarde. |

### 17.3 虚拟式过去时（Pretérito Imperfecto de Subjuntivo）

**构成**：以简单过去时 ellos 形去 -ron，加以下词尾
- -ra, -ras, -ra, -ramos, -rais, -ran（更常用）
- -se, -ses, -se, -semos, -seis, -sen（正式/书面）

| 动词 | yo（-ra形） | 例 |
|------|------------|----|
| hablar | hablara | Si hablara más despacio... |
| comer | comiera | Si comiera menos... |
| vivir | viviera | Si viviera en Madrid... |

**不规则例子**：
- ser/ir → fuera / fuese
- estar → estuviera / estuviese
- tener → tuviera / tuviese
- hacer → hiciera / hiciese

**用法**：
- 与条件式搭配表示非现实条件（类似英语 if I were...）
  *例：Si **tuviera** dinero, **viajaría** a España.*
- 表达与现在事实相反的愿望
  *例：Ojalá **estuviera** aquí.*

### 17.4 虚拟式现在完成时（Pretérito Perfecto de Subjuntivo）
- 结构：haya + 过去分词
- 用法：虚拟语境中强调已完成
  *例：No creo que **haya llegado**.（我不相信他已经到了）*

### 17.5 虚拟式过去完成时（Pluscuamperfecto de Subjuntivo）
- 结构：hubiera + 过去分词
- 用法：与过去事实相反的条件
  *例：Si **hubiera sabido**, **habría venido**.（如果我早知道，我就来了）*

## 20. 被动语态（Voz Pasiva）

### 20.1 被动结构
- 结构：**ser + 过去分词 + por**（被某人）
- 过去分词与主语保持性数一致

*例：La carta **fue escrita** por María.（信被玛丽亚写了）*
*例：Las casas **son construidas** por la empresa.（房子被公司建造）*

### 20.2 Se 被动（Pasiva Refleja）
- 更常用，强调动作而非施动者
- 结构：se + 动词（第三人称）+ 受事主语

*例：**Se venden** casas.（房屋出售）*
*例：**Se habla** español.（说西班牙语）*

### 20.3 Se 无人称（Impersonal）
- 结构：se + 动词第三人称单数（不指定主语）

*例：**Se vive** bien aquí.（这里生活很好）*
*例：**Se trabaja** mucho en este país.（这个国家人们工作很多）*

2. **llanas**（倒数第二音节重读）：不以 n, s, 元音结尾不加，否则加
   *例：árbol（加）, casa（不加）*
3. **esdrújulas**（倒数第三音节重读）：**必须加重音**

   *例：dígamelo*

## 二、粤语拼音系统

### 2.1 主要拼音方案

| 方案名称 | 简称 | 主要使用者 | 特点 |
|----------|------|-----------|------|

### 2.2 声母（Initials）

粤语共有**20个声母**（包括零声母）[citation:7]：

| 发音部位 | 不送气 | 送气 | 鼻音 | 擦音/其他 |
|----------|--------|------|------|----------|
| 双唇音 | b [p] | p [pʰ] | m [m] | — |
| 唇齿音 | — | — | — | f [f] |
| 舌尖音 | d [t] | t [tʰ] | n [n] | l [l] |
| 舌叶音 | z [ts] | c [tsʰ] | — | s [s] |
| 舌根音 | g [k] | k [kʰ] | ng [ŋ] | h [h] |
| 圆唇舌根音 | gw [kʷ] | kw [kʷʰ] | — | w [w] |
| 硬腭近音 | — | — | — | j [j] |

**特别注意事项**：

| 易混淆声母 | 区分要点 | 例词 |
|-----------|----------|------|
| **n- vs l-** | n 要鼻音出气，l 是边音 | 你（nei5）vs 李（lei5）[citation:2] |
| **g- vs gw-** | gw 是圆唇音，嘴唇收圆 | 角（gok3）vs 国（gwok3）[citation:2] |
| **k- vs kw-** | kw 是圆唇送气音 | 抗（kong3）vs 矿（kwong3）[citation:2] |
| **零声母 vs ng-** | ng 要发鼻音 | 压（aat3）vs 牙（ngaa4）[citation:2] |

### 2.3 韵母（Finals）

粤语共有**53个韵母**[citation:7]，由韵腹（主元音）和韵尾组成：

#### 元音韵母

| 类型 | 韵母 | 例字 |
|------|------|------|
| 单韵母 | aa, e, oe, o, i, u, yu | 阿、爹、靴、柯、衣、乌、于 |

#### 复韵母

| 类型 | 韵母 | 例字 |
|------|------|------|
| i/u 尾 | aai, ai, ei, eoi, oi, ui, aau, au, ou, iu | 挨、矮、地、居、哀、灰、交、收、澳、腰 |

#### 鼻音韵母

| 韵尾 | 韵母 | 例字 |
|------|------|------|
| -m | aam, am, im | 监、金、淹 |
| -n | aan, an, eon, on, in, un, yun | 晏、新、敦、安、烟、官、渊 |
| -ng | aang, ang, eng, oeng, ong, ing, ung | 硬、莺、镜、香、肮、英、公 |

#### 塞音韵母（入声）

| 韵尾 | 韵母 | 例字 |
|------|------|------|
| -p | aap, ap, ip | 鸭、急、叶 |
| -t | aat, at, eot, ot, it, ut, yut | 压、吉、卒、喝、热、活、月 |
| -k | aak, ak, ek, oek, ok, ik, uk | 额、北、吃、约、恶、益、屋 |

**特别韵母**：m（唔）、ng（吴）—— 不需要元音自成音节[citation:7]

### 2.4 声调（Tones）

粤语有**6个声调调值**，传统声调学称为"九声六调"[citation:7]：

| 声调 | 名称 | 调值 | 例字 | 发音特点 |
|------|------|------|------|----------|
| 1 | 阴平 | 55/53 | 分（fan1）| 高而平 |
| 2 | 阴上 | 35 | 粉（fan2）| 中升 |
| 3 | 阴去 | 33 | 训（fan3）| 中平 |
| 4 | 阳平 | 21/11 | 焚（fan4）| 低平 |
| 5 | 阳上 | 23/13 | 奋（fan5）| 低升 |
| 6 | 阳去 | 22 | 份（fan6）| 中低平 |

**入声字的处理**：

以 -p、-t、-k 结尾的字称为"入声字"，传统单独列为7、8、9调，但调值与1、3、6调相同，粤拼统一用1、3、6标注[citation:2][citation:7]。

| 传统调号 | 粤拼调号 | 例字 | 韵尾 |
|----------|----------|------|------|
| 7（阴入）| 1 | 色（sik1）| -k |
| 8（中入）| 3 | 锡（sik3）| -k |
| 9（阳入）| 6 | 食（sik6）| -k |

**声调记忆口诀**（用数字1-6代表调值高低）：

> **三碗半牛腩面** / **番茄酱牛腩面**
> 
> 三（saam1 - 调1）碗（wun2 - 调2）半（bun3 - 调3）
> 牛（ngau4 - 调4）腩（naam5 - 调5）面（min6 - 调6）

## 三、粤语语音难点攻克

### 3.1 声母难点

| 难点 | 普通话对照 | 发音要点 | 练习例词 |
|------|-----------|----------|----------|
| **n/l 不分** | 普通话有区分 | n 要鼻音出气，l 舌尖弹开 | 你（nei5）vs 黎（lai4）|
| **ng 声母** | 普通话无 | 舌根抬起抵软腭发鼻音 | 我（ngo5）、牙（ngaa4）|
| **gw/kw 圆唇音** | 普通话 g/k 无圆唇 | 发 g/k 的同时嘴唇收圆 | 国（gwok3）、矿（kwong3）|
| **闭口韵尾 -m** | 普通话无 | 发完元音后双唇闭合 | 心（sam1）、三（saam1）|

### 3.2 韵母难点

| 难点 | 说明 | 练习例词 |
|------|------|----------|
| **闭口 -m 尾** | 与 -n 发音部位不同 | 心（sam1）vs 新（san1）|
| **入声 -p/-t/-k** | 无声除阻，只做口型不爆破 | 十（sap6）、一（jat1）、百（baak3）|
| **oe/eo 系列** | 粤语特有元音 | 靴（hoe1）、去（heoi3）|
| **yu 元音** | 类似普通话 ü | 于（jyu1）、月（jyut6）|

### 3.3 声调难点

| 难点 | 说明 | 练习方法 |
|------|------|----------|
| **调2（35）vs 调5（23）** | 调2起点更高 | 史（si2）vs 市（si5）|
| **调3（33）vs 调6（22）** | 调3更高更平 | 试（si3）vs 事（si6）|
| **调1（55）vs 调4（21）** | 一高一低 | 诗（si1）vs 时（si4）|

**声调训练方法**：
1. 用母语五度标记法感受音高变化
2. 先听辨后模仿，录音对比
3. 利用同音字表进行系统训练
4. 每日朗读带调拼音的句子

## 五、粤语语法特点

### 5.1 语序差异

| 对比项 | 粤语 | 普通话 | 示例（粤语） |
|--------|------|--------|-------------|
| 状语后置 | 动词 + 先 | 先 + 动词 | 你走先（你先走）[citation:3] |

| 比较句 | A + 形容词 + 过 + B | A + 比 + B + 形容词 | 我大过佢（我比他大）|

### 5.2 特色句法结构

**"有"字句**：

**"添"的用法**：
- 粤语：买支添就够（再买一支就够了）[citation:3]
- 普通话：再买一支就够了

**"过"的比较用法**：
- 粤语：佢高过我（他比我高）
- 普通话：他比我高

## 7. 中文(Chinese)
### 1. 汉语拼音是什么

汉语拼音（Hànyǔ Pīnyīn）是现代汉语普通话的标准注音系统。

主要作用：

- 标注汉字读音
- 学习普通话
- 输入法打字
- 字典查阅
- 对外汉语教学

例如：

| 汉字 | 拼音 | 声调 |
|---|---|---|
| 你 | nǐ | 第三声 |
| 好 | hǎo | 第三声 |
| 中国 | zhōng guó | 第一声、第二声 |

### 2. 拼音结构

一个完整拼音通常由：


声母 + 韵母 + 声调


例如：


mā = m + a + 第一声

| 数字本身 | 二、十二、二十 | — |
| 百位以上 | 二百（也可用两百）| 两百（口语更常用）|
| 量词前 | 二个（少用）| **两个**（标准）|
| 重量单位（斤/两）| 二两（重量单位）| — |
| 表示“几”的意思 | — | 两三个、两天 |
| 序数 | 第二 | — |
| 小数/分数 | 零点二、二分之一 | — |
| 成对事物 | — | 两双、两口子 |

**总结**：计数和量词前多用“两”，数字本身和序数用“二”。

      markdown: `# 中英文翻译知识汇总

## 1. 翻译基础概念

### 1.1 翻译的定义
翻译是将一种语言（源语言）的文本转换为另一种语言（目标语言）的过程，同时保持原意的准确性、风格的恰当性和文化的适应性。

### 1.2 翻译的核心原则

| 原则 | 说明 | 中英对照例 |
|------|------|-----------|
| **信（Faithfulness）** | 忠实于原文内容 | 不增不减，不曲解原意 |
| **达（Expressiveness）** | 译文通顺流畅 | 符合目标语言表达习惯 |
| **雅（Elegance）** | 译文文雅得体 | 保留原文风格和修辞 |

### 1.3 翻译的类型

| 类型 | 说明 | 特点 |
|------|------|------|
| 直译（Literal Translation） | 逐字逐句翻译 | 保留原文形式，可能生硬 |
| 意译（Free Translation） | 传达意思为主 | 灵活自然，可能失去原味 |
| 交际翻译（Communicative Translation） | 注重读者理解 | 适应目标文化 |
| 语义翻译（Semantic Translation） | 注重原文语义 | 更贴近原文 |

## 2. 中英文语言差异对比

### 2.1 语序差异

| 对比项 | 中文 | 英文 |
|--------|------|------|
| 基本语序 | SVO（主-谓-宾）| SVO（主-谓-宾）|
| 定语位置 | 定语在前 | 定语从句在后 |
| 状语位置 | 状语在前（时间、地点）| 状语可前可后 |

**示例**：
- 中文：我昨天在学校看到他了。
- 英文：I saw him at school **yesterday**.

### 2.2 形合 vs 意合

| 语言 | 特点 | 说明 |
|------|------|------|
| 英文 | **形合（Hypotaxis）** | 多用连词、介词、关系词连接 |
| 中文 | **意合（Parataxis）** | 靠语序和语境连接，少用连词 |

**示例**：
- 中文：他来，我走。
- 英文：**If** he comes, **then** I will leave.

### 2.3 静态 vs 动态

| 语言 | 特点 | 倾向 |
|------|------|------|
| 英文 | **静态（Static）** | 多用名词、介词、形容词 |
| 中文 | **动态（Dynamic）** | 多用动词 |

**示例**：
- 英文：He is a **good swimmer**.
- 中文：他**游泳**很好。

### 2.4 主动 vs 被动

| 语言 | 倾向 | 说明 |
|------|------|------|
| 英文 | 被动语态使用频繁 | 客观、正式文体 |
| 中文 | 主动语态为主 | 被动含负面意义时使用 |

**示例**：
- 英文：The meeting **was canceled**.
- 中文：会议**取消了**。

### 2.5 抽象 vs 具体

| 语言 | 特点 | 说明 |
|------|------|------|
| 英文 | 多用抽象名词 | -tion, -ment, -ness 等后缀 |
| 中文 | 多用具体词汇 | 动词、形象化表达 |

**示例**：
- 英文：the **development** of economy
- 中文：经济的**发展**（直译）或 **发展**经济（转化）

## 3. 词汇层面的翻译技巧

### 3.1 词义选择

**一词多义**：根据上下文确定词义

| 英文词 | 中文译法 | 例句 |
|--------|----------|------|
| run | 跑 / 运营 / 流淌 / 竞选 | He runs fast. / He runs a company. |
| 打 | hit / fight / make / buy | 打电话 / 打车 / 打人 |

### 3.2 词性转换

| 转换类型 | 中文 | 英文 |
|----------|------|------|
| 名词 → 动词 | 他的演讲很精彩 | He spoke wonderfully. |
| 形容词 → 副词 | 认真工作 | work hard / work seriously |
| 介词 → 动词 | by bus | 坐公交 |

### 3.3 增减词

**增词（Amplification）**：
- 中文无主句补充主语
  - 中文：下雨了。
  - 英文：**It** is raining.
- 补充连接词
  - 中文：他病了，没来。
  - 英文：He was ill, **so** he didn't come.

**减词（Omission）**：
- 省略范畴词
  - 中文：采取一系列措施
  - 英文：take measures（省略“一系列”）
- 省略重复词
  - 中文：他个子高，我也高。
  - 英文：He is tall, and so am I.

### 3.4 重复与替代

| 语言 | 偏好 | 示例 |
|------|------|------|
| 中文 | 多用重复 | 他很聪明，聪明得让人佩服 |
| 英文 | 多用替代（代词、同义词）| He is smart, **so** smart that people admire him |

### 3.5 正反转换

| 转换 | 中文 | 英文 |
|------|------|------|
| 肯定 ↔ 否定 | 直到...才 | not...until |
| 肯定 → 否定 | 他很笨 | He is **not** smart. |
| 否定 → 肯定 | 不可否认 | It is **true** that... |

## 4. 句法层面的翻译技巧

### 4.1 长句拆分

中文多短句，英文多长句。英译中时常将长句拆分为多个短句。

**英文长句**：
> The company, which was founded in 1995 and has since grown to become one of the largest retailers in the country, announced yesterday that it would close 50 stores due to declining sales.

**中文拆分**：
> 这家公司成立于1995年，此后发展成为全国最大的零售商之一。该公司昨天宣布，由于销售额下滑，将关闭50家门店。

### 4.2 语序调整

| 调整类型 | 中文 | 英文 |
|----------|------|------|
| 定语从句 | 我昨天买的那本书 | the book **that I bought yesterday** |
| 状语位置 | 他昨天在图书馆看书 | He read books **in the library yesterday** |
| 时间顺序 | 他吃完饭就出去了 | He went out **after eating** |

### 4.3 被动语态的处理

| 处理方法 | 中文 | 英文 |
|----------|------|------|
| 保留被动（负面）| 被打、被杀 | was beaten / was killed |
| 转为主动 | 问题已解决 | The problem has been solved |
| 无主句 | 据说... | It is said that... |
| 用“让/给/由/受” | 让他跑了 | was allowed to escape |

### 4.4 否定转移

英文中的否定有时会转移到从句中翻译。

| 英文 | 直译（错误）| 正确翻译 |
|------|-------------|----------|
| I don't think he is right. | 我不认为他是对的 | 我认为他不对 |
| He didn't come because he was ill. | 他不是因为生病才来的 | 他没来，因为他病了 |

### 4.5 比较结构的翻译

| 类型 | 中文 | 英文 |
|------|------|------|
| 等比 | 和...一样 | as...as |
| 差比 | 比...更 | more...than |
| 极比 | 最... | the most... |
| 倍比 | 是...的三倍 | three times as...as |

## 5. 文化层面的翻译策略

### 5.1 文化负载词的处理

| 策略 | 说明 | 示例 |
|------|------|------|
| 直译 | 保留原文意象 | 纸老虎 → paper tiger |
| 意译 | 传递文化含义 | 红娘 → matchmaker |
| 音译 | 保留读音 | 功夫 → kung fu |
| 音译+解释 | 音译加注释 | 饺子 → jiaozi (Chinese dumpling) |
| 归化 | 替换为本地文化 | 猪八戒 → a greedy person |
| 异化 | 保留原文文化 | 龙 → dragon（非西方意义的恶龙）|

### 5.2 习语与成语翻译

| 类型 | 中文 | 英文 |
|------|------|------|
| 直译可理解 | 一石二鸟 | kill two birds with one stone |
| 意译 | 对牛弹琴 | cast pearls before swine |
| 借用英文习语 | 同舟共济 | be in the same boat |
| 释义 | 画蛇添足 | do something unnecessary |

### 5.3 诗歌/对联翻译

| 原则 | 说明 |
|------|------|
| 意象优先 | 保留核心意象 |
| 韵律可选 | 不强制押韵 |
| 意美为上 | 三美（意美、音美、形美）中意美最重要 |

**示例**（许渊冲译《静夜思》）：
> 床前明月光 → Before my bed a pool of light
> 疑是地上霜 → I wonder if it's frost aground.
> 举头望明月 → Looking up, I find the moon bright;
> 低头思故乡 → Bowing, in homesickness I'm drowned.

### 5.4 品牌名翻译

| 类型 | 示例 | 翻译策略 |
|------|------|----------|
| 音译 | Coca-Cola → 可口可乐 | 兼顾音义 |
| 意译 | Apple → 苹果 | 直译 |
| 音意结合 | Benz → 奔驰 | 音近+功能 |
| 创新 | IKEA → 宜家 | 全新创造 |

## 9. 翻译实践流程

### 9.1 翻译步骤
原文分析 → 理解上下文 → 翻译初稿 → 审校修改 → 润色定稿


### 9.2 理解阶段
1. 通读全文，把握主旨
2. 分析文体、语气、目标读者
3. 查阅背景知识和专业术语
4. 标记难点和歧义点

### 9.3 表达阶段
1. 先译主干，后添修饰
2. 注意语序调整
3. 选择恰当词汇
4. 保持风格一致

### 9.4 审校阶段
1. 检查信息完整性（对照原文）
2. 检查语言流畅性
3. 检查术语一致性
4. 检查拼写和标点
5. 通读润色
